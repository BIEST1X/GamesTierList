<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMES PLAYED BY BIEST1X</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,0..144,500;1,0..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --bg:#0f0f0f;
  --surface:#151515;
  --surface-hover:#1d1d1d;
  --text:#ececec;
  --text-dim:#aaa;
  --text-faint:#777;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);

  --gold:#e8b563;
  --gold-dim:rgba(232,181,99,.18);

  --teal:#6fc7c0;
  --teal-dim:rgba(111,199,192,.18);

  --orange:#d98b45;
  --orange-dim:rgba(217,139,69,.18);

  --sage:#a3b56b;
  --sage-dim:rgba(163,181,107,.18);

  --rust:#d1673f;
  --rust-dim:rgba(209,103,63,.18);

  --slate:#736e8f;
  --slate-dim:rgba(115,110,143,.18);

  --red:#f55951;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:80px;
  -webkit-font-smoothing:antialiased;
}

::selection{
  background:var(--gold-dim);
  color:var(--gold);
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:var(--line-strong);
  border-radius:6px;
}

:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
  border-radius:3px;
}

/* =========================================================
   HEADER
========================================================= */

header.top{
  max-width:1400px;
  margin:0 auto;
  padding:56px 24px 32px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
}

.brand{
  text-align:center;
}

.brand h1{
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:52px;
  line-height:1.05;
  letter-spacing:-.035em;
  color:var(--text);
}

.brand p{
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  color:#a7a7a7;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-top:10px;
}

.btn-add,
.edit-top-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-weight:600;
  font-size:14px;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

.btn-add{
  right:24px;
  color:#0f0f0f;
  background:var(--gold);
}

.edit-top-btn{
  left:24px;
  color:#0f0f0f;
  background:var(--gold);
}

.btn-add:hover,
.edit-top-btn:hover{
  filter:brightness(1.08);
}

/* =========================================================
   MAIN / TIERS
========================================================= */

main{
  max-width:1600px;
  margin:0 auto;
  padding:34px 24px 40px;
  display:flex;
  gap:20px;
  align-items:flex-start;
  overflow-x:auto;
}

.tier{
  flex:1 1 0;
  min-width:210px;
}

.tier-head{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:0;
  padding-bottom:16px;
  border-bottom:2px solid var(--tier-color);
  margin-bottom:4px;
}

.tier-letter{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:700;
  font-size:42px;
  color:var(--tier-color);
  line-height:1.05;
  margin-bottom:5px;
}

.tier-label{
  font-size:16px;
  line-height:1.25;
  font-weight:600;
  color:#e2e2e2;
}

.tier-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  line-height:1.2;
  color:#9b9b9b;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-top:8px;
  min-height:16px;
}

.tier-count{
  display:none;
}

.rows{
  padding:6px 0 4px;
  min-height:14px;
}

.empty-row{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-faint);
  padding:18px 4px;
  border:1px dashed var(--line-strong);
  border-radius:8px;
  text-align:center;
  margin:8px 0;
}

.row{
  display:flex;
  flex-direction:column;
  padding:10px 11px;
  margin:6px 0;
  background:var(--surface);
  border-left:3px solid var(--tier-color);
  border-radius:6px;
  cursor:pointer;
  transition:background .12s ease, transform .12s ease;
  overflow:visible;
}

.row:hover{
  background:var(--surface-hover);
}

.row.dragging{
  opacity:.35;
}

.row.drag-over-top{
  box-shadow:inset 0 2px 0 var(--tier-color);
}

.row.drag-over-bottom{
  box-shadow:inset 0 -2px 0 var(--tier-color);
}

.row-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  min-width:0;
}

.row-name{
  font-size:13px;
  line-height:1.3;
  font-weight:500;
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:visible;
}

.row-score{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:14px;
  color:var(--tier-color);
  flex-shrink:0;
}

/* =========================================================
   9.5+ HIGHLIGHT
========================================================= */

.row.highlighted .row-name,
.row.highlighted .row-score{
  font-size:15.5px;
  font-weight:700;

  background:linear-gradient(
    90deg,
    #b8f58d 0%,
    #79e5bd 35%,
    #8dd9ff 55%,
    #b8f58d 75%,
    #79e5bd 100%
  );

  background-size:250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:emerald 5s ease-in-out infinite;
}

/* =========================================================
   G TIER
========================================================= */

.tier[data-tier="G"] .tier-letter{
  background:linear-gradient(
    90deg,
    #b8f58d,
    #79e5bd,
    #8dd9ff,
    #b8f58d
  );

  background-size:250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:emerald 5s ease-in-out infinite;
}

@keyframes emerald{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* =========================================================
   SS FIRE EFFECT
========================================================= */

.tier[data-tier="SS"] .tier-letter{
  position:relative;

  text-shadow:
    0 0 4px rgba(255,196,83,.55),
    0 0 10px rgba(255,128,35,.30);

  animation:ssFire 1.35s ease-in-out infinite;
}

.tier[data-tier="SS"] .tier-letter::before,
.tier[data-tier="SS"] .tier-letter::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  bottom:-7px;
  height:13px;
  pointer-events:none;
  filter:blur(5px);
  opacity:.65;

  background:radial-gradient(
    ellipse at 50% 100%,
    rgba(255,205,93,.75) 0%,
    rgba(255,116,35,.42) 35%,
    rgba(255,70,20,0) 72%
  );

  animation:ssFlame 1.1s ease-in-out infinite alternate;
}

.tier[data-tier="SS"] .tier-letter::after{
  left:28%;
  right:28%;
  bottom:-3px;
  height:10px;
  opacity:.45;
  filter:blur(4px);
  animation-delay:-.45s;
}

@keyframes ssFire{
  0%,100%{
    transform:translateY(0) scaleY(1);
    text-shadow:
      0 0 4px rgba(255,196,83,.55),
      0 0 10px rgba(255,128,35,.30);
  }

  35%{
    transform:translateY(-1px) scaleY(1.015);
    text-shadow:
      0 0 6px rgba(255,210,100,.72),
      0 0 14px rgba(255,110,25,.40);
  }

  70%{
    transform:translateY(1px) scaleY(.99);
    text-shadow:
      0 0 3px rgba(255,190,70,.48),
      0 0 12px rgba(255,90,20,.34);
  }
}

@keyframes ssFlame{
  0%{
    transform:translateY(1px) scaleX(.92) scaleY(.8);
  }

  100%{
    transform:translateY(-4px) scaleX(1.08) scaleY(1.18);
  }
}

/* =========================================================
   MODALS
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(3px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  overflow-y:auto;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.modal{
  background:#151515;
  border:1px solid var(--line-strong);
  border-radius:14px;
  width:100%;
  max-width:600px;
  padding:28px 28px 32px;
}

.modal-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.modal-name{
  font-family:'Poppins',sans-serif;
  font-weight:600;
  font-size:26px;
  color:var(--text);
  background:transparent;
  border:none;
  border-bottom:1px solid transparent;
  width:100%;
  padding:2px 0;
}

.modal-name:focus{
  border-bottom:1px solid var(--line-strong);
}

.modal-close{
  background:transparent;
  border:none;
  color:var(--text-faint);
  font-size:20px;
  cursor:pointer;
  padding:4px;
}

.tier-picker{
  display:flex;
  gap:8px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.tier-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  font-weight:700;
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--line-strong);
  background:transparent;
  cursor:pointer;
}

.overall-line{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:20px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.overall-num{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:34px;
  color:var(--gold);
}

.overall-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
}

.cat-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
}

.cat-label{
  font-size:13px;
  color:var(--text-dim);
  width:180px;
  flex-shrink:0;
}

.stars{
  display:flex;
  gap:2px;
}

.star{
  width:15px;
  height:15px;
  cursor:pointer;
  flex-shrink:0;
  color:var(--line-strong);
}

.star.filled{
  color:var(--gold);
}

.star.readonly{
  cursor:default;
}

.cat-num{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  width:42px;
  text-align:right;
}

.custom-rating-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
}

.custom-rating-wrap label{
  font-size:12px;
  color:var(--text-dim);
}

.custom-rating{
  width:130px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-strong);
  border-radius:7px;
  color:var(--text);
  padding:8px 10px;
  font-family:'JetBrains Mono',monospace;
}

.commentary-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin:22px 0 8px;
}

.commentary{
  width:100%;
  min-height:120px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--line-strong);
  border-radius:8px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.55;
  padding:12px 14px;
  resize:vertical;
}

.modal-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:24px;
}

.delete-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--rust);
  background:transparent;
  border:none;
  cursor:pointer;
  padding:6px 10px;
  border-radius:6px;
}

.delete-btn:hover{
  background:var(--rust-dim);
}

.done-btn{
  font-weight:600;
  font-size:13.5px;
  background:var(--gold);
  color:#0f0f0f;
  border:none;
  padding:9px 20px;
  border-radius:8px;
  cursor:pointer;
}

.add-modal{
  max-width:400px;
}

.field-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:6px;
  display:block;
}

.name-input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-strong);
  border-radius:8px;
  color:var(--text);
  font-size:15px;
  padding:11px 12px;
  margin-bottom:18px;
}

.loading-msg,
.error-msg{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  text-align:center;
  padding:60px 20px;
}

.loading-msg{
  color:var(--text-faint);
}

.error-msg{
  color:var(--rust);
}

/* =========================================================
   EDIT TIER SETTINGS
========================================================= */

.tier-edit-fields{
  display:none;
  width:100%;
  margin-top:12px;
  gap:6px;
  flex-direction:column;
}

body.edit-mode .tier-edit-fields{
  display:flex;
}

.tier-edit-input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-strong);
  border-radius:6px;
  color:var(--text);
  padding:6px 8px;
  text-align:center;
  font-size:12px;
}

.tier-edit-input.letter{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:18px;
}

.tier-edit-input:focus{
  border-color:var(--tier-color);
}

/* =========================================================
   EDIT BAR
========================================================= */

.edit-only{
  display:none!important;
}

body.edit-mode .edit-only{
  display:inline-flex!important;
}

#editBar{
  display:none;
}

body.edit-mode #editBar{
  display:none;
}

/* =========================================================
   BACKUP TOOLS
========================================================= */

.backup-tools{
  position:absolute;
  left:24px;
  top:calc(50% + 27px);
  display:none;
  gap:6px;
}

body.edit-mode .backup-tools{
  display:flex;
}

.backup-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  color:var(--text-dim);
  background:rgba(255,255,255,.035);
  border:1px solid var(--line-strong);
  border-radius:6px;
  padding:6px 9px;
  cursor:pointer;
}

.backup-btn:hover{
  color:var(--text);
  background:rgba(255,255,255,.07);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

  main{
    min-width:1100px;
  }

  header.top{
    padding-left:16px;
    padding-right:16px;
  }

  .brand h1{
    font-size:42px;
  }

  .btn-add,
  .edit-top-btn{
    padding:10px 14px;
    font-size:12px;
  }

  .btn-add{
    right:16px;
  }

  .edit-top-btn{
    left:16px;
  }

  .backup-tools{
    left:16px;
    top:calc(50% + 25px);
  }
}

@media(max-width:700px){

  header.top{
    padding-top:34px;
    padding-bottom:26px;
  }

  .brand h1{
    font-size:32px;
  }

  .brand p{
    font-size:11px;
  }

  .btn-add,
  .edit-top-btn{
    position:static;
    transform:none;
    font-size:11px;
    padding:9px 11px;
  }

  header.top{
    justify-content:space-between;
    gap:10px;
  }

  .brand{
    order:2;
  }

  .edit-top-btn{
    order:1;
  }

  .btn-add{
    order:3;
  }
}

</style>
</head>

<body>

<header class="top">

  <button
    class="edit-top-btn"
    id="editButton"
  >
    Edit
  </button>

  <div class="brand">
    <h1>GAMES PLAYED BY BIEST1X</h1>
    <p>a personal tier list</p>
  </div>

  <button
    class="btn-add edit-only"
    id="openAdd"
  >
    + Add game
  </button>

  <div class="backup-tools edit-only">
    <button class="backup-btn" id="exportBackup">
      Export backup
    </button>

    <button class="backup-btn" id="importBackup">
      Import backup
    </button>

    <input
      id="backupFile"
      type="file"
      accept="application/json,.json"
      hidden
    >
  </div>

</header>

<main id="main">

  <div class="loading-msg">
    loading your list…
  </div>

</main>

<!-- ADD GAME -->

<div class="overlay" id="addOverlay">

  <div class="modal add-modal">

    <div class="modal-top">

      <div
        class="modal-name"
        style="font-size:20px;"
      >
        Add a game
      </div>

      <button
        class="modal-close"
        id="closeAdd"
      >
        ✕
      </button>

    </div>

    <label class="field-label">
      Name
    </label>

    <input
      class="name-input"
      id="addName"
      placeholder="e.g. Disco Elysium"
      maxlength="120"
    >

    <label class="field-label">
      Tier
    </label>

    <div
      class="tier-picker"
      id="addTierPicker"
    ></div>

    <div
      class="modal-footer"
      style="justify-content:flex-end"
    >

      <button
        class="done-btn"
        id="confirmAdd"
      >
        Add game
      </button>

    </div>

  </div>

</div>

<!-- GAME -->

<div class="overlay" id="gameOverlay">

  <div
    class="modal"
    id="gameModal"
  ></div>

</div>

<script>

(function(){

"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API = "/api";

let games = [];
let tiers = [];
let editMode = false;
let currentGameId = null;
let addTier = "A";
let dragId = null;

/* =========================================================
   COLORS
========================================================= */

const TIER_COLORS = {
  SS: "var(--gold)",
  S: "var(--teal)",
  A: "var(--orange)",
  B: "var(--sage)",
  C: "var(--rust)",
  X: "var(--slate)",
  G: "var(--sage)"
};

const CATEGORIES = [
  {
    key:"gameplay",
    label:"Gameplay"
  },
  {
    key:"graphics",
    label:"Graphics & Visuals"
  },
  {
    key:"story_pacing",
    label:"Story & Pacing"
  },
  {
    key:"writing",
    label:"Writing"
  },
  {
    key:"voice_acting",
    label:"Voice Acting"
  },
  {
    key:"music_audio",
    label:"Music & Audio Design"
  },
  {
    key:"technical_performance",
    label:"Technical Performance"
  },
  {
    key:"emotional_impact",
    label:"Personal & Emotional Impact"
  }
];

/* =========================================================
   AUTH
========================================================= */

function getToken(){
  return localStorage.getItem("played-admin-token") || "";
}

function authHeaders(){

  const token = getToken();

  return token
    ? { Authorization:"Bearer " + token }
    : {};
}

async function apiFetch(path, options = {}){

  const headers = {
    ...(options.headers || {}),
    ...authHeaders()
  };

  return fetch(
    API + path,
    {
      ...options,
      headers
    }
  );
}

/* =========================================================
   HELPERS
========================================================= */

function getTier(key){
  return tiers.find(t => t.tier_key === key);
}

function gameById(id){
  return games.find(g => g.id === id);
}

function formatNumber(value){

  const n = Number(value);

  if(!Number.isFinite(n))
    return "0";

  return String(n);
}

function score(game){

  if(
    game.custom_overall !== null &&
    game.custom_overall !== undefined &&
    game.custom_overall !== ""
  ){

    return Number(game.custom_overall);

  }

  const values =
    CATEGORIES.map(
      c =>
        Number(
          game[c.key] || 0
        )
    );

  return Math.round(
    (
      values.reduce(
        (a,b) => a+b,
        0
      ) /
      values.length
    ) * 10
  ) / 10;
}

function isHighlighted(game){

  return score(game) >= 9.5;

}

function escapeHtml(str){

  const d =
    document.createElement("div");

  d.textContent =
    str ?? "";

  return d.innerHTML;
}

function colorForTier(key){

  return (
    TIER_COLORS[key] ||
    "var(--gold)"
  );

}

/* =========================================================
   LOAD
========================================================= */

async function apiGetTiers(){

  const response =
    await fetch(
      API + "/tiers",
      {
        cache:"no-store"
      }
    );

  const data =
    await response.json();

  if(
    !response.ok ||
    !data.success
  ){

    throw new Error(
      data.error ||
      "Failed to load tiers"
    );

  }

  tiers =
    data.tiers || [];

}

async function apiGetGames(){

  const response =
    await fetch(
      API + "/games",
      {
        cache:"no-store"
      }
    );

  const data =
    await response.json();

  if(
    !response.ok ||
    !data.success
  ){

    throw new Error(
      data.error ||
      "Failed to load games"
    );

  }

  games =
    data.games || [];

}

async function load(){

  editMode =
    localStorage.getItem(
      "played-edit-unlocked"
    ) === "yes" &&
    !!getToken();

  try{

    await apiGetTiers();
    await apiGetGames();

    render();

  }catch(error){

    console.error(error);

    document.getElementById(
      "main"
    ).innerHTML = `
      <div class="error-msg">
        Failed to load games.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}

========================================================= */

function renderRow(
  game,
  tier
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "row";

  if(
    isHighlighted(game)
  ){

    row.classList.add(
      "highlighted"
    );

  }

  row.dataset.id =
    game.id;

  row.draggable =
    editMode;

  row.style.setProperty(
    "--tier-color",
    colorForTier(
      tier.tier_key
    )
  );

  row.innerHTML = `

    <div class="row-top">

      <div class="row-name">
        ${escapeHtml(game.name)}
      </div>

      <div class="row-score">
        ${formatNumber(score(game))}
      </div>

    </div>
  `;

  row.addEventListener(
    "click",
    () => {

      if(
        row.classList.contains(
          "dragging"
        )
      )
        return;

      openGame(
        game.id
      );

    }
  );

  if(editMode){

    row.addEventListener(
      "dragstart",
      event => {

        dragId =
          game.id;

        row.classList.add(
          "dragging"
        );

        event.dataTransfer.effectAllowed =
          "move";

        event.dataTransfer.setData(
          "text/plain",
          game.id
        );

      }
    );

    row.addEventListener(
      "dragend",
      () => {

        row.classList.remove(
          "dragging"
        );

        dragId = null;

        document
          .querySelectorAll(
            ".drag-over-top,.drag-over-bottom"
          )
          .forEach(
            el => {

              el.classList.remove(
                "drag-over-top",
                "drag-over-bottom"
              );

            }
          );

      }
    );

    row.addEventListener(
      "dragover",
      event => {

        event.preventDefault();

        if(
          !dragId ||
          dragId === game.id
        )
          return;

        const rect =
          row.getBoundingClientRect();

        const before =
          event.clientY <
          rect.top +
          rect.height / 2;

        row.classList.toggle(
          "drag-over-top",
          before
        );

        row.classList.toggle(
          "drag-over-bottom",
          !before
        );

      }
    );

    row.addEventListener(
      "dragleave",
      () => {

        row.classList.remove(
          "drag-over-top",
          "drag-over-bottom"
        );

      }
    );

    row.addEventListener(
      "drop",
      async event => {

        event.preventDefault();

        if(
          !dragId ||
          dragId === game.id
        )
          return;

        const rect =
          row.getBoundingClientRect();

        const before =
          event.clientY <
          rect.top +
          rect.height / 2;

        row.classList.remove(
          "drag-over-top",
          "drag-over-bottom"
        );

        await moveGame(
          dragId,
          tier.tier_key,
          game.id,
          before
        );

      }
    );

  }

  return row;

}

/* =========================================================
   DROP ZONE
========================================================= */

function enableDropZone(
  rows,
  tierKey
){

  if(!editMode)
    return;

  rows.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

    }
  );

  rows.addEventListener(
    "drop",
    async event => {

      event.preventDefault();

      if(
        !dragId
      )
        return;

      if(
        event.target.closest(
          ".row"
        )
      )
        return;

      await moveGame(
        dragId,
        tierKey,
        null,
        false
      );

    }
  );

}

/* =========================================================
   MOVE
========================================================= */

async function moveGame(
  id,
  targetTier,
  targetId,
  before
){

  const targetGames =
    games
      .filter(
        g =>
          g.tier ===
          targetTier &&
          g.id !== id
      )
      .sort(
        (a,b) =>
          Number(a.position || 0) -
          Number(b.position || 0)
      );

  let position =
    targetGames.length;

  if(targetId){

    const index =
      targetGames.findIndex(
        g =>
          g.id === targetId
      );

    if(index >= 0){

      position =
        before
          ? index
          : index + 1;

    }

  }

  try{

    const response =
      await apiFetch(
        "/games/move",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              id,
              tier:targetTier,
              position
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Failed to move game"
      );

    }

    await apiGetGames();

    render();

  }catch(error){

    alert(
      "Could not move game: " +
      error.message
    );

  }

}

function renderCategories(
  game
){

  const list =
    document.getElementById(
      "categoryList"
    );

  list.innerHTML = "";

  CATEGORIES.forEach(
    category => {

      const value =
        Number(
          game[category.key] || 0
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "cat-row";

      row.innerHTML = `

        <div class="cat-label">
          ${escapeHtml(
            category.label
          )}
        </div>

        <div class="stars">

          ${Array.from(
            {length:10},
            (_,index) => `

              <div
                class="star ${
                  index < value
                    ? "filled"
                    : ""
                } ${
                  editMode
                    ? ""
                    : "readonly"
                }"
                data-value="${index + 1}"
                data-category="${category.key}"
              >
                ${starSvg()}
              </div>

            `
          ).join("")}

        </div>

        <div class="cat-num">
          ${formatNumber(value)}
        </div>

      `;

      list.appendChild(
        row
      );

    }
  );

  if(!editMode)
    return;

  list
    .querySelectorAll(
      ".star"
    )
    .forEach(
      star => {

        star.addEventListener(
          "click",
          async () => {

            const category =
              star.dataset.category;

            const value =
              Number(
                star.dataset.value
              );

            const current =
              Number(
                game[category] || 0
              );

            const newValue =
              current === value
                ? value - 1
                : value;

            try{

              await updateGame({
                id:game.id,
                [category]:
                  newValue
              });

              await apiGetGames();

              renderGameModal();

            }catch(error){

              alert(
                "Could not save rating: " +
                error.message
              );

            }

          }
        );

      }
    );

}

function downloadJson(
  filename,
  data
){

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}

              g.writing || 0
            ),

          voice_acting:
            Number(
              g.voice_acting || 0
            ),

          music_audio:
            Number(
              g.music_audio || 0
            ),

          technical_performance:
            Number(
              g.technical_performance || 0
            ),

          emotional_impact:
            Number(
              g.emotional_impact || 0
            ),

          custom_overall:
            (
              g.custom_overall === null ||
              g.custom_overall === undefined ||
              g.custom_overall === ""
            )
              ? null
              : Number(
                  g.custom_overall
                )

        })
      )

  };

  downloadJson(
    "played-tier-list-backup-" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".json",
    backup
  );

}

async function importBackupFile(
  file
){

  if(!editMode)
    return;

  const text =
    await file.text();

  let backup;

  try{

    backup =
      JSON.parse(
        text
      );

  }catch{

    throw new Error(
      "Backup file is not valid JSON."
    );

  }

  if(
    backup?.format !==
      "played-tier-list-backup" ||
    !Array.isArray(
      backup.games
    )
  ){

    throw new Error(
      "This is not a valid Played tier-list backup."
    );

  }

  if(
    !confirm(
      "Restore this backup?\n\n" +
      "This will replace the current games, ratings, positions and tier descriptions with the saved backup."
    )
  )
    return;

  const response =
    await apiFetch(
      "/backup/import",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(
            backup
          )
      }
    );

  const data =
    await response.json();

  if(
    !response.ok ||
    !data.success
  ){

    throw new Error(
      data.error ||
      "Failed to restore backup"
    );

  }

  await apiGetTiers();
  await apiGetGames();

  render();

  alert(
    "Backup restored successfully."
  );

}

document
  .getElementById(
    "exportBackup"
  )
  .addEventListener(
    "click",
    () => {

      exportBackup()
        .catch(
          error =>
            alert(
              "Could not export backup: " +
              error.message
            )
        );

    }
  );

document
  .getElementById(
    "importBackup"
  )
  .addEventListener(
    "click",
    () => {

      if(!editMode)
        return;

      document
        .getElementById(
          "backupFile"
        )
        .click();

    }
  );

document
  .getElementById(
    "backupFile"
  )
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target
          .files?.[0];

      event.target.value =
        "";

      if(!file)
        return;

      try{

        await importBackupFile(
          file
        );

      }catch(error){

        alert(
          "Could not restore backup: " +
          error.message
        );

      }

    }
  );

/* =========================================================
   EDIT LOGIN
========================================================= */

async function tryUnlock(){

  const password =
    prompt(
      "Enter edit password:"
    );

  if(password === null)
    return;

  try{

    const response =
      await fetch(
        API + "/login",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              password
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      alert(
        "Wrong password."
      );

      return;

    }

    localStorage.setItem(
      "played-admin-token",
      data.token
    );

    localStorage.setItem(
      "played-edit-unlocked",
      "yes"
    );

    editMode =
      true;

    render();

  }catch(error){

    alert(
      "Could not enter edit mode: " +
      error.message
    );

  }

}

function lockEdit(){

  localStorage.removeItem(
    "played-admin-token"
  );

  localStorage.removeItem(
    "played-edit-unlocked"
  );

  editMode =
    false;

  closeGame();

  render();

}

document
  .getElementById(
    "editButton"
  )
  .addEventListener(
    "click",
    () => {

      if(editMode)
        lockEdit();
      else
        tryUnlock();

    }
  );

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key !==
      "Escape"
    )
      return;

    const gameOverlay =
      document.getElementById(
        "gameOverlay"
      );

    const addOverlay =
      document.getElementById(
        "addOverlay"
      );

    if(
      gameOverlay.classList.contains(
        "open"
      )
    ){

      closeGame();

    }

    if(
      addOverlay.classList.contains(
        "open"
      )
    ){

      addOverlay.classList.remove(
        "open"
      );

    }

  }
);

/* =========================================================
   START
========================================================= */

load();

})();

</script>
