<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GAMES PLAYED BY BIEST1X</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,0..144,500;1,0..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0f0e17;
  --surface:#17151f;
  --surface-hover:#1e1b29;

  --text:#ece9f5;
  --text-dim:#8b87a3;
  --text-faint:#5c5870;

  --tier-description:#aaa6bc;

  --line:rgba(236,233,245,0.09);
  --line-strong:rgba(236,233,245,0.16);

  --gold:#e8b563;
  --gold-dim:rgba(232,181,99,0.18);

  --teal:#6fc7c0;
  --teal-dim:rgba(111,199,192,0.18);

  --sage:#a3b56b;
  --sage-dim:rgba(163,181,107,0.18);

  --rust:#d1673f;
  --rust-dim:rgba(209,103,63,0.18);

  --slate:#736e8f;
  --slate-dim:rgba(115,110,143,0.18);

  --highlight:#f55951;
  --highlight-orange:#e8a04d;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:80px;
  -webkit-font-smoothing:antialiased;
}

::selection{
  background:var(--gold-dim);
  color:var(--gold);
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:var(--line-strong);
  border-radius:6px;
}

:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
  border-radius:3px;
}

/* =========================================================
   HEADER
========================================================= */

header.top{
  max-width:1400px;
  margin:0 auto;
  padding:56px 24px 32px;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  position:relative;

  border-bottom:1px solid var(--line);
}

.brand{
  text-align:center;
}

.brand h1{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:36px;
  color:var(--text);
  letter-spacing:-.025em;
}

.brand p{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-faint);
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-top:8px;
  text-align:center;
}

.btn-add{
  position:absolute;
  right:24px;
  bottom:32px;

  font-weight:600;
  font-size:14px;

  color:#0f0e17;
  background:var(--gold);

  border:none;
  padding:12px 20px;

  border-radius:8px;
  cursor:pointer;
}

.btn-add:hover{
  filter:brightness(1.08);
}

/* =========================================================
   MAIN
========================================================= */

main{
  max-width:1400px;
  margin:0 auto;
  padding:32px 24px 40px;

  display:flex;
  gap:18px;
  align-items:flex-start;

  overflow-x:auto;
}

.tier{
  flex:1 1 0;
  min-width:200px;
}

/* =========================================================
   TIER HEADER
========================================================= */

.tier-head{
  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  gap:4px;

  padding-bottom:12px;

  border-bottom:2px solid var(--tier-color);

  margin-bottom:4px;
}

.tier-letter{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:600;

  /* previous size increased by another 25% */
  font-size:48px;

  color:var(--tier-color);
  line-height:1;
}

.tier-label{
  font-size:16px;
  font-weight:600;
  line-height:1.3;
}

.tier-sub{
  font-family:'JetBrains Mono',monospace;

  /* previous size increased by another 25% */
  font-size:12.5px;

  color:var(--tier-description);

  text-transform:uppercase;
  letter-spacing:.05em;

  margin-top:7px;

  line-height:1.35;
}

.tier-meta{
  width:100%;
  margin-top:4px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.tier-count{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-dim);
}

/* =========================================================
   ROWS
========================================================= */

.rows{
  padding:6px 0 4px;
  min-height:14px;
}

.empty-row{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-faint);

  padding:18px 4px;

  border:1px dashed var(--line-strong);
  border-radius:8px;

  text-align:center;
  margin:8px 0;
}

.row{
  display:flex;
  flex-direction:column;

  padding:9px 10px;
  margin:6px 0;

  background:var(--surface);

  border-left:3px solid var(--tier-color);
  border-radius:6px;

  cursor:pointer;

  transition:
    background .12s ease,
    transform .12s ease;
}

.row:hover{
  background:var(--surface-hover);
}

.row.dragging{
  opacity:.35;
}

.row.drag-over-top{
  box-shadow:inset 0 2px 0 var(--tier-color);
}

.row.drag-over-bottom{
  box-shadow:inset 0 -2px 0 var(--tier-color);
}

.row-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
}

.row-name{
  font-size:13px;
  font-weight:500;

  flex:1;

  overflow-wrap:anywhere;
  word-break:normal;

  line-height:1.35;
}

.row-score{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:14px;

  color:var(--tier-color);

  flex-shrink:0;
}

/* =========================================================
   HIGHLIGHTED 9.5+
========================================================= */

.row.highlighted .row-name,
.row.highlighted .row-score{
  font-size:15.5px;

  background:
    linear-gradient(
      90deg,
      var(--highlight) 0%,
      var(--highlight-orange) 50%,
      var(--highlight) 100%
    );

  background-size:200% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:
    highlightGradient 5s ease-in-out infinite;
}

.row.highlighted .row-name{
  font-weight:600;
}

.row.highlighted .row-score{
  font-weight:700;
}

@keyframes highlightGradient{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

/* =========================================================
   MODAL
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(5,4,9,.7);

  backdrop-filter:blur(3px);

  display:flex;
  align-items:flex-start;
  justify-content:center;

  padding:40px 16px;

  overflow-y:auto;

  z-index:100;

  opacity:0;
  pointer-events:none;

  transition:opacity .15s ease;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.modal{
  background:var(--surface);

  border:1px solid var(--line-strong);
  border-radius:14px;

  width:100%;
  max-width:560px;

  padding:28px 28px 32px;
}

.modal-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:12px;
  margin-bottom:18px;
}

.modal-name{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;

  color:var(--text);

  background:transparent;
  border:none;

  border-bottom:1px solid transparent;

  width:100%;

  padding:2px 0;
}

.modal-name:focus{
  border-bottom:1px solid var(--line-strong);
}

.modal-close{
  background:transparent;
  border:none;

  color:var(--text-faint);

  font-size:20px;

  cursor:pointer;
  padding:4px;
}

.tier-picker{
  display:flex;
  gap:8px;

  margin-bottom:22px;

  flex-wrap:wrap;
}

.tier-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  font-weight:700;

  padding:6px 12px;

  border-radius:20px;

  border:1px solid var(--line-strong);

  background:transparent;

  cursor:pointer;
}

.overall-line{
  display:flex;
  align-items:baseline;

  gap:10px;

  margin-bottom:20px;
  padding-bottom:18px;

  border-bottom:1px solid var(--line);
}

.overall-num{
  font-family:'JetBrains Mono',monospace;

  font-weight:700;
  font-size:34px;

  color:var(--gold);
}

.overall-label{
  font-size:11px;
  color:var(--text-faint);

  text-transform:uppercase;
  letter-spacing:.06em;
}

.cat-row{
  display:flex;
  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:7px 0;
}

.cat-label{
  font-size:13px;
  color:var(--text-dim);

  width:130px;
  flex-shrink:0;
}

.stars{
  display:flex;
  gap:2px;
}

.star{
  width:15px;
  height:15px;

  cursor:pointer;

  flex-shrink:0;

  color:var(--line-strong);
}

.star.filled{
  color:var(--gold);
}

.star.readonly{
  cursor:default;
}

.cat-num{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;

  color:var(--text-faint);

  width:34px;

  text-align:right;
}

.commentary-label{
  font-size:11px;

  color:var(--text-faint);

  text-transform:uppercase;
  letter-spacing:.06em;

  margin:22px 0 8px;
}

.commentary{
  width:100%;

  min-height:120px;

  background:rgba(255,255,255,.02);

  border:1px solid var(--line-strong);

  border-radius:8px;

  color:var(--text);

  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.55;

  padding:12px 14px;

  resize:vertical;
}

.custom-rating-wrap{
  margin-top:18px;
  padding-top:18px;

  border-top:1px solid var(--line);
}

.custom-rating-label{
  display:block;

  font-size:11px;

  color:var(--text-faint);

  text-transform:uppercase;
  letter-spacing:.06em;

  margin-bottom:7px;
}

.custom-rating{
  width:180px;

  background:rgba(255,255,255,.03);

  border:1px solid var(--line-strong);

  border-radius:8px;

  color:var(--text);

  font-family:'JetBrains Mono',monospace;

  font-size:14px;

  padding:9px 10px;
}

.custom-rating-note{
  margin-top:7px;

  font-size:11px;

  color:var(--text-faint);
}

.modal-footer{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-top:24px;
}

.delete-btn{
  font-family:'JetBrains Mono',monospace;

  font-size:11.5px;

  color:var(--rust);

  background:transparent;

  border:none;

  cursor:pointer;

  padding:6px 10px;

  border-radius:6px;
}

.delete-btn:hover{
  background:var(--rust-dim);
}

.done-btn{
  font-weight:600;
  font-size:13.5px;

  background:var(--gold);

  color:#0f0e17;

  border:none;

  padding:9px 20px;

  border-radius:8px;

  cursor:pointer;
}

/* =========================================================
   ADD MODAL
========================================================= */

.add-modal{
  max-width:400px;
}

.field-label{
  font-size:11px;

  color:var(--text-faint);

  text-transform:uppercase;
  letter-spacing:.06em;

  margin-bottom:6px;

  display:block;
}

.name-input{
  width:100%;

  background:rgba(255,255,255,.03);

  border:1px solid var(--line-strong);

  border-radius:8px;

  color:var(--text);

  font-size:15px;

  padding:11px 12px;

  margin-bottom:18px;
}

/* =========================================================
   MESSAGES
========================================================= */

.loading-msg{
  width:100%;

  font-family:'JetBrains Mono',monospace;

  font-size:12px;

  color:var(--text-faint);

  text-align:center;

  padding:60px 20px;
}

.error-msg{
  width:100%;

  font-family:'JetBrains Mono',monospace;

  font-size:12px;

  color:var(--rust);

  text-align:center;

  padding:60px 20px;
}

/* =========================================================
   EDIT MODE
========================================================= */

.edit-only{
  display:none!important;
}

body.edit-mode .edit-only{
  display:inline-flex!important;
}

body.edit-mode .btn-add.edit-only{
  display:inline-block!important;
}

/* =========================================================
   EDIT BAR
========================================================= */

#editBar{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:200;

  display:flex;

  align-items:center;

  gap:8px;

  background:var(--surface);

  border:1px solid var(--line-strong);

  border-radius:30px;

  padding:8px 8px 8px 16px;

  box-shadow:
    0 8px 24px rgba(0,0,0,.35);

  font-family:'JetBrains Mono',monospace;

  font-size:11.5px;
}

#editBar .status{
  color:var(--text-faint);
}

#editBar button{
  font-family:'Inter',sans-serif;

  font-weight:600;

  font-size:12.5px;

  border:none;

  border-radius:20px;

  padding:8px 14px;

  cursor:pointer;
}

.lock-btn{
  background:transparent;

  color:var(--text-dim);

  border:1px solid var(--line-strong)!important;
}

.export-btn{
  background:var(--gold);

  color:#0f0e17;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  header.top{
    padding:32px 16px 24px;
  }

  .brand h1{
    font-size:28px;
  }

  .btn-add{
    right:16px;
    bottom:24px;

    padding:10px 14px;
    font-size:13px;
  }

  main{
    padding:24px 16px 40px;
  }

  .tier{
    min-width:190px;
  }

  .tier-letter{
    font-size:43px;
  }

  .tier-label{
    font-size:15px;
  }

  .tier-sub{
    font-size:11.5px;
  }

  #editBar{
    right:10px;
    bottom:10px;
  }

  #editBar .status{
    display:none;
  }

}

</style>

</head>

<body>

<header class="top">

  <div class="brand">

    <h1>GAMES PLAYED BY BIEST1X</h1>

    <p>a personal tier list</p>

  </div>

  <button
    class="btn-add edit-only"
    id="openAdd"
  >
    + Add game
  </button>

</header>

<main id="main">

  <div class="loading-msg">
    loading your list…
  </div>

</main>

<!-- =======================================================
     ADD GAME
======================================================= -->

<div
  class="overlay"
  id="addOverlay"
>

  <div class="modal add-modal">

    <div class="modal-top">

      <div
        class="modal-name"
        style="font-size:20px;"
      >
        Add a game
      </div>

      <button
        class="modal-close"
        id="closeAdd"
      >
        ✕
      </button>

    </div>

    <label class="field-label">
      Name
    </label>

    <input
      class="name-input"
      id="addName"
      placeholder="e.g. Disco Elysium"
      maxlength="80"
    >

    <label class="field-label">
      Tier
    </label>

    <div
      class="tier-picker"
      id="addTierPicker"
    ></div>

    <div
      class="modal-footer"
      style="justify-content:flex-end"
    >

      <button
        class="done-btn"
        id="confirmAdd"
      >
        Add game
      </button>

    </div>

  </div>

</div>

<!-- =======================================================
     GAME MODAL
======================================================= -->

<div
  class="overlay"
  id="gameOverlay"
>

  <div
    class="modal"
    id="gameModal"
  ></div>

</div>

<div id="editBar"></div>

<script>

(function(){

/* =========================================================
   CONFIG
========================================================= */

const API = '/api';

/* =========================================================
   CATEGORIES
========================================================= */

const CATEGORIES = [

  {
    key:'gameplay',
    label:'Gameplay'
  },

  {
    key:'visuals',
    label:'Visuals & Graphics'
  },

  {
    key:'story',
    label:'Story'
  },

  {
    key:'music',
    label:'Music'
  },

  {
    key:'voice',
    label:'Voice Acting'
  },

  {
    key:'sound',
    label:'Sound Design'
  },

  {
    key:'writing',
    label:'Writing'
  }

];

/* =========================================================
   TIERS
========================================================= */

const TIERS = [

  {
    key:'S',
    letter:'SS',
    label:'Masterpiece',
    sub:'Best games',
    color:'var(--gold)',
    dim:'var(--gold-dim)'
  },

  {
    key:'A',
    letter:'S',
    label:'Amazing game',
    sub:'Great games',
    color:'var(--teal)',
    dim:'var(--teal-dim)'
  },

  {
    key:'B',
    letter:'A',
    label:'Good / Okay',
    sub:'Solid games',
    color:'var(--sage)',
    dim:'var(--sage-dim)'
  },

  {
    key:'F',
    letter:'B',
    label:'Nothing special / meh',
    sub:'Forgettable',
    color:'var(--rust)',
    dim:'var(--rust-dim)'
  },

  {
    key:'X',
    letter:'—',
    label:'Dislike / dropped',
    sub:'Not for me',
    color:'var(--slate)',
    dim:'var(--slate-dim)'
  }

];

/* =========================================================
   STATE
========================================================= */

let games = [];

let editMode = false;

let currentGameId = null;

let addTier = 'B';

let dragId = null;

/* =========================================================
   HELPERS
========================================================= */

function getTier(key){

  return (
    TIERS.find(
      tier => tier.key === key
    ) || TIERS[2]
  );

}

function calculatedScore(game){

  const values =
    CATEGORIES.map(
      category =>
        Number(
          game[category.key] || 0
        )
    );

  const average =
    values.reduce(
      (a,b) => a + b,
      0
    ) /
    values.length;

  return Math.round(
    average * 10
  ) / 10;

}

function score(game){

  const custom =
    game.custom_score;

  if(
    custom !== null &&
    custom !== undefined &&
    custom !== ''
  ){

    const number =
      Number(custom);

    if(
      Number.isFinite(number)
    ){

      return number;

    }

  }

  return calculatedScore(game);

}

function isHighlighted(game){

  return score(game) >= 9.5;

}

function escapeHtml(str){

  const d =
    document.createElement('div');

  d.textContent =
    str ?? '';

  return d.innerHTML;

}

function gameById(id){

  return games.find(
    game => game.id === id
  );

}

/* =========================================================
   AUTH
========================================================= */

function authHeaders(){

  const token =
    localStorage.getItem(
      'played-admin-token'
    );

  return token
    ? {
        Authorization:
          'Bearer ' + token
      }
    : {};

}

/* =========================================================
   API
========================================================= */

async function apiGetGames(){

  const response =
    await fetch(
      API + '/games',
      {
        cache:'no-store'
      }
    );

  if(!response.ok){

    throw new Error(
      'Failed to load games'
    );

  }

  const data =
    await response.json();

  if(!data.success){

    throw new Error(
      data.error ||
      'Failed to load games'
    );

  }

  games =
    data.games || [];

}

/* =========================================================
   LOAD
========================================================= */

async function load(){

  editMode =
    localStorage.getItem(
      'played-edit-unlocked'
    ) === 'yes';

  try{

    await apiGetGames();

    render();

    renderEditBar();

  }catch(error){

    console.error(error);

    document
      .getElementById('main')
      .innerHTML = `

        <div class="error-msg">

          Failed to load games.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      `;

  }

}

/* =========================================================
   RENDER
========================================================= */

function render(){

  document.body.classList.toggle(
    'edit-mode',
    editMode
  );

  const main =
    document.getElementById(
      'main'
    );

  main.innerHTML = '';

  TIERS.forEach(tier => {

    const tierGames =
      games.filter(
        game =>
          game.tier === tier.key
      );

    main.appendChild(
      renderTier(
        tier,
        tierGames
      )
    );

  });

  renderAddTierPicker();

}

function renderTier(
  tier,
  tierGames
){

  const section =
    document.createElement(
      'section'
    );

  section.className =
    'tier';

  section.style.setProperty(
    '--tier-color',
    tier.color
  );

  section.style.setProperty(
    '--tier-dim',
    tier.dim
  );

  const head =
    document.createElement(
      'div'
    );

  head.className =
    'tier-head';

  head.innerHTML = `

    <span class="tier-letter">
      ${tier.letter}
    </span>

    <div>

      <div class="tier-label">
        ${tier.label}
      </div>

      <div class="tier-sub">
        ${tier.sub}
      </div>

    </div>

    <div class="tier-meta">

      <span class="tier-count">
        ${tierGames.length}
      </span>

    </div>

  `;

  section.appendChild(head);

  const rows =
    document.createElement(
      'div'
    );

  rows.className =
    'rows';

  rows.dataset.tier =
    tier.key;

  if(!tierGames.length){

    const empty =
      document.createElement(
        'div'
      );

    empty.className =
      'empty-row';

    empty.textContent =
      'No games here yet.';

    rows.appendChild(
      empty
    );

  }else{

    tierGames.forEach(
      game => {

        rows.appendChild(
          renderRow(
            game,
            tier
          )
        );

      }
    );

  }

  section.appendChild(rows);

  setupDnD(rows);

  return section;

}

/* =========================================================
   DRAG / DROP
========================================================= */

function setupDnD(
  container
){

  container.addEventListener(
    'dragstart',
    event => {

      if(!editMode)
        return;

      const row =
        event.target.closest(
          '.row'
        );

      if(!row)
        return;

      dragId =
        row.dataset.id;

      row.classList.add(
        'dragging'
      );

      event.dataTransfer.effectAllowed =
        'move';

      event.dataTransfer.setData(
        'text/plain',
        dragId
      );

    }
  );

  container.addEventListener(
    'dragend',
    event => {

      const row =
        event.target.closest(
          '.row'
        );

      if(row){

        row.classList.remove(
          'dragging'
        );

      }

      document
        .querySelectorAll(
          '.drag-over-top,.drag-over-bottom'
        )
        .forEach(
          element => {

            element.classList.remove(
              'drag-over-top',
              'drag-over-bottom'
            );

          }
        );

    }
  );

  container.addEventListener(
    'dragover',
    event => {

      if(!editMode)
        return;

      event.preventDefault();

      const after =
        getDragAfterElement(
          container,
          event.clientY
        );

      container
        .querySelectorAll(
          '.row'
        )
        .forEach(
          row => {

            row.classList.remove(
              'drag-over-top',
              'drag-over-bottom'
            );

          }
        );

      if(after){

        after.classList.add(
          'drag-over-top'
        );

      }else{

        const rows =
          [
            ...container.querySelectorAll(
              '.row:not(.dragging)'
            )
          ];

        if(rows.length){

          rows[
            rows.length - 1
          ].classList.add(
            'drag-over-bottom'
          );

        }

      }

    }
  );

  container.addEventListener(
    'drop',
    async event => {

      event.preventDefault();

      if(
        !editMode ||
        !dragId
      ){

        return;

      }

      const movedId =
        dragId;

      const targetTier =
        container.dataset.tier;

      const after =
        getDragAfterElement(
          container,
          event.clientY
        );

      /*
       * Calculate destination entirely
       * on the client.
       */

      const targetGames =
        games.filter(
          game =>
            game.tier === targetTier &&
            game.id !== movedId
        );

      let targetPosition;

      if(after){

        const index =
          targetGames.findIndex(
            game =>
              game.id ===
              after.dataset.id
          );

        targetPosition =
          index >= 0
            ? index
            : targetGames.length;

      }else{

        targetPosition =
          targetGames.length;

      }

      /*
       * Optimistically update the local
       * array immediately.
       *
       * This makes dragging feel instant.
       */

      const movedGame =
        gameById(movedId);

      if(!movedGame){

        dragId = null;
        return;

      }

      const oldTier =
        movedGame.tier;

      const oldIndex =
        games.findIndex(
          game =>
            game.id === movedId
        );

      if(oldIndex >= 0){

        games.splice(
          oldIndex,
          1
        );

      }

      movedGame.tier =
        targetTier;

      const sameTier =
        games.filter(
          game =>
            game.tier === targetTier
        );

      if(
        targetPosition >=
        sameTier.length
      ){

        games.push(
          movedGame
        );

      }else{

        const targetGame =
          sameTier[
            targetPosition
          ];

        const insertIndex =
          games.indexOf(
            targetGame
          );

        games.splice(
          insertIndex,
          0,
          movedGame
        );

      }

      /*
       * Rebuild positions locally.
       */

      TIERS.forEach(
        tier => {

          let position = 0;

          games
            .filter(
              game =>
                game.tier ===
                tier.key
            )
            .forEach(
              game => {

                game.position =
                  position++;

              }
            );

        }
      );

      dragId = null;

      render();

      /*
       * Save in background.
       * The UI does NOT wait for the
       * server before updating.
       */

      try{

        const response =
          await fetch(
            API + '/games/move',
            {
              method:'POST',

              headers:{
                'Content-Type':
                  'application/json',

                ...authHeaders()
              },

              body:JSON.stringify({

                id:movedId,

                tier:targetTier,

                position:targetPosition

              })
            }
          );

        const data =
          await response.json();

        if(
          !response.ok ||
          !data.success
        ){

          throw new Error(
            data.error ||
            'Failed to move game'
          );

        }

      }catch(error){

        console.error(
          'Move failed:',
          error
        );

        /*
         * Restore server state if
         * something actually failed.
         */

        try{

          await apiGetGames();

          render();

        }catch(
          restoreError
        ){

          console.error(
            restoreError
          );

        }

        alert(
          'Could not move game: ' +
          error.message
        );

      }

    }
  );

}

function getDragAfterElement(
  container,
  y
){

  const rows =
    [
      ...container.querySelectorAll(
        '.row:not(.dragging)'
      )
    ];

  return rows.reduce(
    (closest,child) => {

      const box =
        child.getBoundingClientRect();

      const offset =
        y -
        box.top -
        box.height / 2;

      if(
        offset < 0 &&
        offset >
          closest.offset
      ){

        return {
          offset,
          element:child
        };

      }

      return closest;

    },
    {
      offset:-Infinity,
      element:null
    }
  ).element;

}

function renderGameModal(){

    gameById(

    );

    document.getElementById(
      'gameModal'
    );

  const catRows =
    CATEGORIES
      .map(
        category => {

          const value =
            Number(
              game[
                category.key
              ] || 0
            );

          const stars =
            Array.from(
              {length:10}
            )
            .map(
              (_,i) => {

                const filled =
                  i < value;

                return `

                  <span
                    class="
                      star
                      ${filled
                        ? 'filled'
                        : ''}
                      ${editMode
                        ? ''
                        : 'readonly'}
                    "
                    data-cat="${
                      category.key
                    }"
                    data-val="${
                      i + 1
                    }"
                  >

                    ${starSvg()}

                  </span>

                `;

              }
            )
            .join('');

          return `

            <div class="cat-row">

              <div class="cat-label">
                ${category.label}
              </div>

              <div class="stars">
                ${stars}
              </div>

              <div class="cat-num">
                ${value}/10
              </div>

            </div>

          `;

        }
      )
      .join('');

  const customValue =
    game.custom_score ??
    '';

  modal.innerHTML = `

    <div class="modal-top">

      <input
        class="modal-name"
        id="editName"

        value="${escapeHtml(
          game.name
        )}"

        maxlength="80"

        ${editMode
          ? ''
          : 'readonly'}
      >

      <button
        class="modal-close"
        id="closeGame"
      >
        ✕
      </button>

    </div>

    <div
      class="tier-picker edit-only"
      id="editTierPicker"
    ></div>

    <div class="overall-line">

      <span class="overall-num">

        ${score(game).toFixed(1)}

      </span>

      <span class="overall-label">
        / 10 overall
      </span>

    </div>

    <div id="catRows">

      ${catRows}

    </div>

    <div class="custom-rating-wrap edit-only">

      <label
        class="custom-rating-label"
        for="customRating"
      >
        Custom overall rating
      </label>

      <input
        class="custom-rating"
        id="customRating"
        type="number"
        step="any"
        value="${escapeHtml(
          customValue
        )}"
        placeholder="Automatic"
      >

      <div class="custom-rating-note">

        Leave empty to use the automatic
        category average.

      </div>

    </div>

    <div class="commentary-label">

      ${
        editMode
          ? 'Your commentary'
          : 'Commentary'
      }

    </div>

    <textarea
      class="commentary"
      id="commentary"

      placeholder="${
        editMode
          ? 'What did you think of it?'
          : 'No commentary yet.'
      }"

      ${editMode
        ? ''
        : 'readonly'}
    >${escapeHtml(
      game.commentary || ''
    )}</textarea>

    <div class="modal-footer">

      <button
        class="delete-btn edit-only"
        id="deleteGame"
      >
        Delete game
      </button>

      <button
        class="done-btn"
        id="doneGame"
        style="margin-left:auto"
      >
        Done
      </button>

    </div>

  `;

  /* =======================================================
     TIER PICKER
  ======================================================= */

  if(editMode){

    const tierWrap =
      document.getElementById(
        'editTierPicker'
      );

    TIERS.forEach(
      tier => {

        const chip =
          document.createElement(
            'button'
          );

        chip.className =
          'tier-chip';

        chip.textContent =
          tier.letter +
          ' — ' +
          tier.label;

        chip.style.borderColor =
          tier.color;

        chip.style.color =
          game.tier === tier.key
            ? '#0f0e17'
            : tier.color;

        chip.style.background =
          game.tier === tier.key
            ? tier.color
            : 'transparent';

        chip.addEventListener(
          'click',
          async () => {

            if(
              game.tier ===
              tier.key
            ){

              return;

            }

            try{

              const targetGames =
                games.filter(
                  current =>
                    current.tier ===
                    tier.key
                );

              const response =
                await fetch(
                  API +
                  '/games/move',
                  {
                    method:'POST',

                    headers:{
                      'Content-Type':
                        'application/json',

                      ...authHeaders()
                    },

                    body:JSON.stringify({

                      id:game.id,

                      tier:tier.key,

                      position:
                        targetGames.length

                    })

                  }
                );

              const data =
                await response.json();

              if(
                !response.ok ||
                !data.success
              ){

                throw new Error(
                  data.error ||
                  'Failed to move game'
                );

              }

              /*
               * Update locally rather than
               * doing a slow full reload.
               */

              game.tier =
                tier.key;

              game.position =
                targetGames.length;

              TIERS.forEach(
                currentTier => {

                  let position = 0;

                  games
                    .filter(
                      item =>
                        item.tier ===
                        currentTier.key
                    )
                    .forEach(
                      item => {

                        item.position =
                          position++;

                      }
                    );

                }
              );

              renderGameModal();

              render();

              /*
               * Re-open modal after render()
               * because render() rebuilds page.
               */

              document
                .getElementById(
                  'gameOverlay'
                )
                .classList.add(
                  'open'
                );

              renderGameModal();

            }catch(error){

              alert(
                'Could not move game: ' +
                error.message
              );

            }

          }
        );

        tierWrap.appendChild(
          chip
        );

      }
    );

  }

  /* =======================================================
     BUTTONS
  ======================================================= */

  document
    .getElementById(
      'closeGame'
    )
    .addEventListener(
      'click',
      closeGame
    );

  document
    .getElementById(
      'doneGame'
    )
    .addEventListener(
      'click',
      closeGame
    );

  /* =======================================================
     NAME
  ======================================================= */

  if(editMode){

    document
      .getElementById(
        'editName'
      )
      .addEventListener(
        'change',
        async event => {

          try{

            await updateGame({

              id:game.id,

              name:
                event.target.value

            });

          }catch(error){

            alert(
              'Could not save name: ' +
              error.message
            );

          }

        }
      );

    /* =====================================================
       COMMENTARY
    ===================================================== */

    document
      .getElementById(
        'commentary'
      )
      .addEventListener(
        'change',
        async event => {

          try{

            await updateGame({

              id:game.id,

              commentary:
                event.target.value

            });

          }catch(error){

            alert(
              'Could not save commentary: ' +
              error.message
            );

          }

        }
      );

    /* =====================================================
       CUSTOM SCORE
    ===================================================== */

    document
      .getElementById(
        'customRating'
      )
      .addEventListener(
        'change',
        async event => {

          const value =
            event.target.value.trim();

          try{

            await updateGame({

              id:game.id,

              custom_score:
                value === ''
                  ? null
                  : Number(value)

            });

            renderGameModal();

          }catch(error){

            alert(
              'Could not save custom rating: ' +
              error.message
            );

          }

        }
      );

    /* =====================================================
       RATINGS
    ===================================================== */

    modal
      .querySelectorAll(
        '.star'
      )
      .forEach(
        star => {

          star.addEventListener(
            'click',
            async () => {

              const category =
                star.dataset.cat;

              const value =
                parseInt(
                  star.dataset.val,
                  10
                );

              const current =
                Number(
                  game[
                    category
                  ] || 0
                );

              const newValue =
                current === value
                  ? value - 1
                  : value;

              try{

                await updateGame({

                  id:game.id,

                  [category]:
                    newValue

                });

                renderGameModal();

              }catch(error){

                alert(
                  'Could not save rating: ' +
                  error.message
                );

              }

            }
          );

        }
      );

    /* =====================================================
       DELETE
    ===================================================== */

    document
      .getElementById(
        'deleteGame'
      )
      .addEventListener(
        'click',
        async () => {

          if(
            !confirm(
              `Delete "${game.name}"? This can't be undone.`
            )
          ){

            return;

          }

          try{

            const response =
              await fetch(
                API +
                '/games/' +
                encodeURIComponent(
                  game.id
                ),
                {
                  method:'DELETE',

                  headers:{
                    ...authHeaders()
                  }
                }
              );

            const data =
              await response.json();

            if(
              !response.ok ||
              !data.success
            ){

              throw new Error(
                data.error ||
                'Failed to delete game'
              );

            }

            await apiGetGames();

            closeGame();

          }catch(error){

            alert(
              'Could not delete game: ' +
              error.message
            );

          }

        }
      );

  }

}

/* =========================================================
   UPDATE GAME
========================================================= */

async function updateGame(
  changes
){

  const response =
    await fetch(
      API + '/games',
      {
        method:'PUT',

        headers:{
          'Content-Type':
            'application/json',

          ...authHeaders()
        },

        body:JSON.stringify(
          changes
        )

      }
    );

  const data =
    await response.json();

  if(
    !response.ok ||
    !data.success
  ){

    throw new Error(
      data.error ||
      'Failed to save'
    );

  }

  /*
   * Update only the local game instead
   * of doing another network request.
   *
   * This makes rating/comment editing
   * considerably faster.
   */

  const game =
    gameById(
      changes.id
    );

  if(game){

    Object.keys(changes)
      .forEach(
        key => {

          if(key !== 'id'){

            game[key] =
              changes[key];

          }

        }
      );

  }

  render();

}

async function tryUnlock(){

  const password =
    prompt(
      'Enter edit password:'
    );

  if(password === null)
    return;

  try{

    const response =
      await fetch(
        API + '/login',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            password
          })

        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      alert(
        'Wrong password.'
      );

      return;

    }

    localStorage.setItem(
      'played-admin-token',
      data.token
    );

    localStorage.setItem(
      'played-edit-unlocked',
      'yes'
    );

    editMode =
      true;

    render();

    renderEditBar();

  }catch(error){

    alert(
      'Could not log in: ' +
      error.message
    );

  }

}

function lockEdit(){

  localStorage.removeItem(
    'played-edit-unlocked'
  );

  localStorage.removeItem(
    'played-admin-token'
  );

  editMode =
    false;

  render();

  renderEditBar();

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  'keydown',
  event => {

    if(
      event.key !==
      'Escape'
    ){

      return;

    }

    const gameOverlay =
      document.getElementById(
        'gameOverlay'
      );

    const addOverlay =
      document.getElementById(
        'addOverlay'
      );

    if(
      gameOverlay.classList.contains(
        'open'
      )
    ){

      closeGame();

    }

    if(
      addOverlay.classList.contains(
        'open'
      )
    ){

      addOverlay.classList.remove(
        'open'
      );

    }

  }
);

/* =========================================================
   START
========================================================= */

load();

})();

</script>

</body>
</html>
