<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMES PLAYED BY BIEST1X</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,0..144,500;1,0..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --bg:#0f0f0f;
  --surface:#151515;
  --surface-hover:#1d1d1d;
  --text:#ececec;
  --text-dim:#aaa;
  --text-faint:#777;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);

  --gold:#e8b563;
  --gold-dim:rgba(232,181,99,.18);

  --diamond:#8dd9ff;
  --diamond-dim:rgba(141,217,255,.18);

  --teal:#6fc7c0;
  --teal-dim:rgba(111,199,192,.18);

  --orange:#d98b45;
  --orange-dim:rgba(217,139,69,.18);

  --sage:#a3b56b;
  --sage-dim:rgba(163,181,107,.18);

  --rust:#d1673f;
  --rust-dim:rgba(209,103,63,.18);

  --slate:#736e8f;
  --slate-dim:rgba(115,110,143,.18);

  --red:#f55951;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:80px;
  -webkit-font-smoothing:antialiased;
  overflow-x:auto;
}

::selection{
  background:var(--gold-dim);
  color:var(--gold);
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:var(--line-strong);
  border-radius:6px;
}

:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
  border-radius:3px;
}

/* =========================================================
   HEADER
========================================================= */

header.top{
  max-width:1400px;
  margin:0 auto;
  padding:56px 24px 32px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
}

.brand{
  text-align:center;
}

.brand h1{
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:52px;
  line-height:1.05;
  letter-spacing:-.035em;
  color:var(--text);
}

.brand p{
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  color:#a7a7a7;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-top:10px;
}

.btn-add,
.edit-top-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-weight:600;
  font-size:14px;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

.btn-add{
  right:24px;
  color:#0f0f0f;
  background:var(--gold);
}

.edit-top-btn{
  left:24px;
  color:#0f0f0f;
  background:var(--gold);
}

.btn-add:hover,
.edit-top-btn:hover{
  filter:brightness(1.08);
}

/* =========================================================
   MAIN / TIERS
========================================================= */

/*
   IMPORTANT:
   The previous version used:
       width:max-content;
       min-width:100%;

   That forced the tier list to behave like a full-width
   container and made the content sit against the left side.

   This version makes the actual tier-list width shrink to
   its content and centers it on the page.
*/

main{
  width:max-content;
  min-width:0;
  max-width:none;
  margin:0 auto;
  padding:34px 24px 40px;
  display:flex;
  gap:20px;
  align-items:flex-start;
}

.tier{
  flex:0 0 auto;
  width:max-content;
  min-width:210px;
}

.tier-head{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:0;
  padding-bottom:16px;
  border-bottom:2px solid var(--tier-color);
  margin-bottom:4px;
}

.tier-letter{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:700;
  font-size:42px;
  color:var(--tier-color);
  line-height:1.05;
  margin-bottom:5px;
}

.tier-label{
  font-size:16px;
  line-height:1.25;
  font-weight:600;
  color:#e2e2e2;
}

.tier-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  line-height:1.2;
  color:#9b9b9b;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-top:8px;
  min-height:16px;
}

.rows{
  padding:6px 0 4px;
  min-height:14px;
}

.empty-row{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-faint);
  padding:18px 4px;
  border:1px dashed var(--line-strong);
  border-radius:8px;
  text-align:center;
  margin:8px 0;
}

.row{
  display:flex;
  flex-direction:column;
  padding:10px 11px;
  margin:6px 0;
  background:var(--surface);
  border-left:3px solid var(--tier-color);
  border-radius:6px;
  cursor:pointer;
  transition:background .12s ease, transform .12s ease;
  overflow:visible;
}

.row:hover{
  background:var(--surface-hover);
}

.row.dragging{
  opacity:.35;
}

.row.drag-over-top{
  box-shadow:inset 0 2px 0 var(--tier-color);
}

.row.drag-over-bottom{
  box-shadow:inset 0 -2px 0 var(--tier-color);
}

.row-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  min-width:0;
}

.row-name{
  font-size:13px;
  line-height:1.3;
  font-weight:500;
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:visible;
}

.row-score{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:14px;
  color:var(--tier-color);
  flex-shrink:0;
}

/* =========================================================
   9.5+ HIGHLIGHT
========================================================= */

.row.highlighted .row-name{
  font-family:'Inter',sans-serif;
  font-size:15.5px;
  font-weight:700;

  background:linear-gradient(
    90deg,
    #8CD4FF 0%,
    #8CFFEA 100%
  );

  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:highlightGradient 5s ease-in-out infinite;
}

.row.highlighted .row-score{
  font-family:'JetBrains Mono',monospace;
  font-size:15.5px;
  font-weight:700;

  background:linear-gradient(
    90deg,
    #8CD4FF 0%,
    #8CFFEA 100%
  );

  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:highlightGradient 5s ease-in-out infinite;
}

@keyframes highlightGradient{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

/* =========================================================
   SS TIER — NEON DIAMOND GLOW
========================================================= */

.tier[data-tier="SS"] .tier-letter{
  color:var(--diamond);
  text-shadow:
    0 0 5px rgba(141,217,255,.55),
    0 0 12px rgba(141,217,255,.45),
    0 0 24px rgba(141,217,255,.32),
    0 0 42px rgba(141,217,255,.20);

  animation:ssNeon 2.8s ease-in-out infinite;
}

@keyframes ssNeon{
  0%,100%{
    text-shadow:
      0 0 5px rgba(141,217,255,.55),
      0 0 12px rgba(141,217,255,.45),
      0 0 24px rgba(141,217,255,.32),
      0 0 42px rgba(141,217,255,.20);
  }

  50%{
    text-shadow:
      0 0 7px rgba(141,217,255,.75),
      0 0 16px rgba(141,217,255,.62),
      0 0 30px rgba(141,217,255,.48),
      0 0 52px rgba(141,217,255,.28);
  }
}

/* =========================================================
   G TIER
========================================================= */

.tier[data-tier="G"] .tier-letter{
  background:linear-gradient(
    90deg,
    #b8f58d,
    #79e5bd,
    #8dd9ff,
    #b8f58d
  );

  background-size:250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:emerald 5s ease-in-out infinite;
}

@keyframes emerald{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

/* =========================================================
   MODALS
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(3px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  overflow-y:auto;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.modal{
  background:#151515;
  border:1px solid var(--line-strong);
  border-radius:14px;
  width:100%;
  max-width:600px;
  padding:28px 28px 32px;
}

.modal-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.modal-name{
  font-family:'Poppins',sans-serif;
  font-weight:600;
  font-size:26px;
  color:var(--text);
  background:transparent;
  border:none;
  border-bottom:1px solid transparent;
  width:100%;
  padding:2px 0;
}

.modal-name:focus{
  border-bottom:1px solid var(--line-strong);
}

.modal-close{
  background:transparent;
  border:none;
  color:var(--text-faint);
  font-size:20px;
  cursor:pointer;
  padding:4px;
}

.tier-picker{
  display:flex;
  gap:8px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.tier-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  font-weight:700;
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--line-strong);
  background:transparent;
  cursor:pointer;
}

.overall-line{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:20px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.overall-num{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:34px;
  color:var(--gold);
}

.overall-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
}

.cat-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
}

.cat-label{
  font-size:13px;
  color:var(--text-dim);
  width:180px;
  flex-shrink:0;
}

.stars{
  display:flex;
  gap:2px;
}

.star{
  width:15px;
  height:15px;
  cursor:pointer;
  flex-shrink:0;
  color:var(--line-strong);
}

.star.filled{
  color:var(--gold);
}

.star.readonly{
  cursor:default;
}

.cat-num{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
  width:42px;
  text-align:right;
}

.custom-rating-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
}

.custom-rating-wrap label{
  font-size:12px;
  color:var(--text-dim);
}

.custom-rating{
  width:130px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-strong);
  border-radius:7px;
  color:var(--text);
  padding:8px 10px;
  font-family:'JetBrains Mono',monospace;
}

.commentary-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin:22px 0 8px;
}

.commentary{
  width:100%;
  min-height:120px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--line-strong);
  border-radius:8px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.55;
  padding:12px 14px;
  resize:vertical;
}

.modal-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:24px;
}

.delete-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--rust);
  background:transparent;
  border:none;
  cursor:pointer;
  padding:6px 10px;
  border-radius:6px;
}

.delete-btn:hover{
  background:var(--rust-dim);
}

.done-btn{
  font-weight:600;
  font-size:13.5px;
  background:var(--gold);
  color:#0f0f0f;
  border:none;
  padding:9px 20px;
  border-radius:8px;
  cursor:pointer;
}

.add-modal{
  max-width:400px;
}

.field-label{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:6px;
  display:block;
}

.name-input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-strong);
  border-radius:8px;
  color:var(--text);
  font-size:15px;
  padding:11px 12px;
  margin-bottom:18px;
}

.loading-msg,
.error-msg{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  text-align:center;
  padding:60px 20px;
}

.loading-msg{
  color:var(--text-faint);
}

.error-msg{
  color:var(--rust);
}

/* =========================================================
   EDIT TIER SETTINGS
========================================================= */

.tier-edit-fields{
  display:none;
  width:100%;
  margin-top:12px;
  gap:6px;
  flex-direction:column;
}

body.edit-mode .tier-edit-fields{
  display:flex;
}

.tier-edit-input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-strong);
  border-radius:6px;
  color:var(--text);
  padding:6px 8px;
  text-align:center;
  font-size:12px;
}

.tier-edit-input.letter{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:18px;
}

.tier-edit-input:focus{
  border-color:var(--tier-color);
}

/* =========================================================
   EDIT BAR
========================================================= */

.edit-only{
  display:none!important;
}

body.edit-mode .edit-only{
  display:inline-flex!important;
}

#editBar{
  display:none;
}

body.edit-mode #editBar{
  display:none;
}

  }

    min-width:1100px;
    margin-left:24px;
    margin-right:24px;
  }

<script>
(function(){

"use strict";

const API = "/api";

let games = [];
let tiers = [];
let editMode = false;
let currentGameId = null;
let addTier = "A";
let dragId = null;

const TIER_COLORS = {
  SS: "var(--diamond)",
  S: "var(--gold)",
  A: "var(--orange)",
  B: "var(--sage)",
  C: "#A35656",
  X: "var(--slate)",
  G: "var(--sage)"
};

const CATEGORIES = [
  {
    key:"gameplay",
    label:"Gameplay"
  },
  {
    key:"graphics",
    label:"Graphics & Visuals"
  },
  {
    key:"story_pacing",
    label:"Story & Pacing"
  },
  {
    key:"writing",
    label:"Writing"
  },
  {
    key:"voice_acting",
    label:"Voice Acting"
  },
  {
    key:"music_audio",
    label:"Music & Audio Design"
  },
  {
    key:"technical_performance",
    label:"Technical Performance"
  },
  {
    key:"emotional_impact",
    label:"Personal & Emotional Impact"
  }
];

function getToken(){

  return localStorage.getItem(
    "played-admin-token"
  ) || "";

}

function authHeaders(){

  const token = getToken();

  return token
    ? { Authorization:"Bearer " + token }
    : {};

}

async function apiFetch(path, options = {}){

  const headers = {
    ...(options.headers || {}),
    ...authHeaders()
  };

  return fetch(
    API + path,
    {
      ...options,
      headers
    }
  );

}

function getTier(key){

  return tiers.find(
    t => t.tier_key === key
  );

}

function gameById(id){

  return games.find(
    g => g.id === id
  );

}

function formatNumber(value){

  const n = Number(value);

  if(!Number.isFinite(n))
    return "0";

  return String(n);

}

function score(game){

  if(
    game.custom_overall !== null &&
    game.custom_overall !== undefined &&
    game.custom_overall !== ""
  ){

    return Number(game.custom_overall);

  }

  const values =
    CATEGORIES.map(c =>
      Number(game[c.key] || 0)
    );

  return Math.round(
    (
      values.reduce((a,b) => a+b,0) /
      values.length
    ) * 10
  ) / 10;

}

function isHighlighted(game){

  return score(game) >= 9.5;

}

function escapeHtml(str){

  const d =
    document.createElement("div");

  d.textContent = str ?? "";

  return d.innerHTML;

}

function colorForTier(key){

  return TIER_COLORS[key] || "var(--gold)";

}

async function apiGetTiers(){

  const response =
    await fetch(API + "/tiers", {
      cache:"no-store"
    });

  const data =
    await response.json();

  if(!response.ok || !data.success)
    throw new Error(
      data.error || "Failed to load tiers"
    );

  tiers = data.tiers || [];

}

async function apiGetGames(){

  const response =
    await fetch(API + "/games", {
      cache:"no-store"
    });

  const data =
    await response.json();

  if(!response.ok || !data.success)
    throw new Error(
      data.error || "Failed to load games"
    );

  games = data.games || [];

}

async function load(){

  editMode =
    localStorage.getItem(
      "played-edit-unlocked"
    ) === "yes" &&
    !!getToken();

  try{

    await apiGetTiers();
    await apiGetGames();

    render();

  }catch(error){

    console.error(error);

    document.getElementById(
      "main"
    ).innerHTML = `
      <div class="error-msg">
        Failed to load games.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}

function render(){

  document.body.classList.toggle(
    "edit-mode",
    editMode
  );

  renderHeader();

  const main =
    document.getElementById("main");

  main.innerHTML = "";

  tiers.forEach(tier => {

    const tierGames =
      games.filter(
        g => g.tier === tier.tier_key
      );

    tierGames.sort(
      (a,b) =>
        Number(a.position || 0) -
        Number(b.position || 0)
    );

    main.appendChild(
      renderTier(tier,tierGames)
    );

  });

  renderAddTierPicker();

}

function renderHeader(){

  const editButton =
    document.getElementById(
      "editButton"
    );

  if(editMode){

    editButton.textContent = "Exit";

  }else{

    editButton.textContent = "Edit";

  }

}

function renderTier(tier,tierGames){

  const section =
    document.createElement("section");

  section.className = "tier";

  section.dataset.tier =
    tier.tier_key;

  const color =
    colorForTier(tier.tier_key);

  section.style.setProperty(
    "--tier-color",
    color
  );

  const head =
    document.createElement("div");

  head.className = "tier-head";

  head.innerHTML = `

    <span class="tier-letter">
      ${escapeHtml(tier.letter)}
    </span>

    <div class="tier-label">
      ${escapeHtml(tier.label)}
    </div>

    <div class="tier-sub">
      ${escapeHtml(tier.sub)}
    </div>

    <div class="tier-edit-fields">

      <input
        class="tier-edit-input letter"
        data-field="letter"
        value="${escapeHtml(tier.letter)}"
        maxlength="8"
      >

      <input
        class="tier-edit-input"
        data-field="label"
        value="${escapeHtml(tier.label)}"
        maxlength="60"
      >

      <input
        class="tier-edit-input"
        data-field="sub"
        value="${escapeHtml(tier.sub)}"
        maxlength="60"
      >

    </div>
  `;

  section.appendChild(head);

  const rows =
    document.createElement("div");

  rows.className = "rows";

  rows.dataset.tier =
    tier.tier_key;

  if(tierGames.length === 0){

    const empty =
      document.createElement("div");

    empty.className = "empty-row";

    empty.textContent =
      "No games here yet.";

    rows.appendChild(empty);

  }else{

    tierGames.forEach(game => {

      rows.appendChild(
        renderRow(game,tier)
      );

    });

  }

  section.appendChild(rows);

  if(editMode){

    head
      .querySelectorAll(
        ".tier-edit-input"
      )
      .forEach(input => {

        input.addEventListener(
          "change",
          async event => {

            const field =
              event.target.dataset.field;

            try{

              await apiFetch(
                "/tiers",
                {
                  method:"PUT",
                  headers:{
                    "Content-Type":
                      "application/json"
                  },
                  body:JSON.stringify({
                    tier_key:tier.tier_key,
                    letter:
                      field === "letter"
                        ? event.target.value
                        : tier.letter,
                    label:
                      field === "label"
                        ? event.target.value
                        : tier.label,
                    sub:
                      field === "sub"
                        ? event.target.value
                        : tier.sub
                  })
                }
              );

              await apiGetTiers();

              render();

            }catch(error){

              alert(
                "Could not save category: " +
                error.message
              );

            }

          }
        );

      });

  }

  setupDnD(rows);

  return section;

}

function renderRow(game,tier){

  const row =
    document.createElement("div");

  row.className = "row";

  if(isHighlighted(game))
    row.classList.add("highlighted");

  row.dataset.id = game.id;

  row.draggable = editMode;

  row.style.setProperty(
    "--tier-color",
    colorForTier(tier.tier_key)
  );

  row.innerHTML = `

    <div class="row-top">

      <div
        class="row-name"
        title="${escapeHtml(game.name)}"
      >
        ${escapeHtml(game.name)}
      </div>

      <div class="row-score">
        ${formatNumber(score(game))}
      </div>

    </div>
  `;

  row.addEventListener(
    "click",
    () => {

      if(
        row.classList.contains(
          "dragging"
        )
      )
        return;

      openGame(game.id);

    }
  );

  return row;

}

function setupDnD(container){

  container.addEventListener(
    "dragstart",
    event => {

      if(!editMode)
        return;

      const row =
        event.target.closest(".row");

      if(!row)
        return;

      dragId =
        row.dataset.id;

      row.classList.add(
        "dragging"
      );

      event.dataTransfer.effectAllowed =
        "move";

    }
  );

  container.addEventListener(
    "dragend",
    event => {

      const row =
        event.target.closest(".row");

      if(row)
        row.classList.remove(
          "dragging"
        );

      container
        .querySelectorAll(".row")
        .forEach(r =>
          r.classList.remove(
            "drag-over-top",
            "drag-over-bottom"
          )
        );

    }
  );

  container.addEventListener(
    "dragover",
    event => {

      if(!editMode)
        return;

      event.preventDefault();

      const after =
        getDragAfterElement(
          container,
          event.clientY
        );

      container
        .querySelectorAll(".row")
        .forEach(r =>
          r.classList.remove(
            "drag-over-top",
            "drag-over-bottom"
          )
        );

      if(after){

        after.classList.add(
          "drag-over-top"
        );

      }else{

        const rows =
          [
            ...container.querySelectorAll(
              ".row:not(.dragging)"
            )
          ];

        if(rows.length){

          rows[
            rows.length - 1
          ].classList.add(
            "drag-over-bottom"
          );

        }

      }

    }
  );

  container.addEventListener(
    "drop",
    async event => {

      event.preventDefault();

      if(!editMode || !dragId)
        return;

      const targetTier =
        container.dataset.tier;

      const after =
        getDragAfterElement(
          container,
          event.clientY
        );

      const tierGames =
        games
          .filter(
            g =>
              g.tier === targetTier &&
              g.id !== dragId
          )
          .sort(
            (a,b) =>
              Number(a.position || 0) -
              Number(b.position || 0)
          );

      let position;

      if(after){

        const index =
          tierGames.findIndex(
            g =>
              g.id === after.dataset.id
          );

        position =
          index < 0
            ? tierGames.length
            : index;

      }else{

        position =
          tierGames.length;

      }

      const movingId =
        dragId;

      dragId = null;

      try{

        const response =
          await apiFetch(
            "/games/move",
            {
              method:"POST",
              headers:{
                "Content-Type":
                  "application/json"
              },
              body:JSON.stringify({
                id:movingId,
                tier:targetTier,
                position
              })
            }
          );

        const data =
          await response.json();

        if(!response.ok || !data.success)
          throw new Error(
            data.error ||
            "Failed to move game"
          );

        await apiGetGames();

        render();

      }catch(error){

        alert(
          "Could not move game: " +
          error.message
        );

      }

    }
  );

}

function getDragAfterElement(
  container,
  y
){

  const rows =
    [
      ...container.querySelectorAll(
        ".row:not(.dragging)"
      )
    ];

  return rows.reduce(
    (closest,child) => {

      const box =
        child.getBoundingClientRect();

      const offset =
        y -
        box.top -
        box.height / 2;

      if(
        offset < 0 &&
        offset > closest.offset
      ){

        return {
          offset,
          element:child
        };

      }

      return closest;

    },
    {
      offset:-Infinity,
      element:null
    }
  ).element;

}

function renderAddTierPicker(){

  const wrap =
    document.getElementById(
      "addTierPicker"
    );

  if(!wrap)
    return;

  wrap.innerHTML = "";

  tiers.forEach(tier => {

    const chip =
      document.createElement("button");

    chip.className =
      "tier-chip";

    chip.textContent =
      tier.letter;

    chip.style.borderColor =
      colorForTier(tier.tier_key);

    chip.style.color =
      addTier === tier.tier_key
        ? "#0f0f0f"
        : colorForTier(tier.tier_key);

    chip.style.background =
      addTier === tier.tier_key
        ? colorForTier(tier.tier_key)
        : "transparent";

    chip.addEventListener(
      "click",
      () => {

        addTier =
          tier.tier_key;

        renderAddTierPicker();

      }
    );

    wrap.appendChild(chip);

  });

}

    input.focus();

    return;

  }

  try{

    const response =
      await apiFetch(
        "/games",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            name,
            tier:addTier
          })
        }
      );

    const data =
      await response.json();

      throw new Error(
        data.error ||

      .classList.remove("open");

  }catch(error){

    alert(

      error.message
    );

  }

}
