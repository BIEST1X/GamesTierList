<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Played by BIEST1X</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at top, #151515 0%, #0f0f0f 45%, #0c0c0c 100%);
  color: #f2f2f2;
  font-family: Inter, Arial, sans-serif;
  overflow-x: auto;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding: 42px 32px 70px;
}

.header {
  text-align: center;
  margin-bottom: 32px;
}

.header h1 {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  font-size: 35px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.8px;
}

.header p {
  margin: 12px 0 0;
  font-size: 18px;
  color: #a7a7a7;
  font-weight: 500;
  letter-spacing: 0.1px;
}

.top-actions {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.left-actions,
.right-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.action-button {
  border: 1px solid #303030;
  background: #181818;
  color: #eeeeee;
  border-radius: 8px;
  padding: 9px 15px;
  font-size: 14px;
  font-weight: 600;
  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    transform 0.15s ease;
}

.action-button:hover {
  background: #202020;
  border-color: #444;
}

.action-button:active {
  transform: translateY(1px);
}

.action-button.primary {
  background: #202020;
}

.tiers {
  width: 100%;
  display: flex;
  align-items: stretch;
  gap: 12px;
  overflow: visible;
}

.tier-column {
  flex: 1 1 0;
  min-width: 250px;
  display: flex;
  flex-direction: column;
  min-height: 350px;
}

.tier-header {
  text-align: center;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.tier-letter {
  font-size: 43px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -1px;
}

.tier-label {
  margin-top: 11px;
  color: #c5c5c5;
  font-size: 19px;
  line-height: 1.15;
  font-weight: 600;
}

.tier-sub {
  margin-top: 7px;
  color: #9b9b9b;
  font-size: 17px;
  line-height: 1.2;
  font-weight: 500;
}

.tier-games {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 90px;
}

.game-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
  padding: 9px 10px;
  border-radius: 7px;
  background: #151515;
  border: 1px solid #1e1e1e;
  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    transform 0.12s ease;
}

.game-row:hover {
  background: #1a1a1a;
  border-color: #2b2b2b;
}

.game-row.dragging {
  opacity: 0.5;
}

.game-name {
  min-width: 0;
  flex: 1 1 auto;
  white-space: nowrap;
  overflow: visible;
  text-overflow: clip;
  font-size: 14px;
  line-height: 1.15;
  font-weight: 500;
  color: #ededed;
  cursor: pointer;
}

.game-rating {
  flex: 0 0 auto;
  font-size: 14px;
  line-height: 1;
  color: #dedede;
  font-weight: 600;
  white-space: nowrap;
}

.game-row.highlighted {
  background: #171717;
}

.game-row.highlighted .game-name,
.game-row.highlighted .game-rating {
  font-size: 16.5px;
  font-weight: 800;
  background: linear-gradient(
    90deg,
    #f55951 0%,
    #f56b45 45%,
    #ff9a42 100%
  );
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: highlightedGradient 5s linear infinite;
}

@keyframes highlightedGradient {
  0% {
    background-position: 0% 50%;
  }

  100% {
    background-position: 220% 50%;
  }
}

.tier-SS .tier-letter {
  color: #f0c36a;
}

.tier-S .tier-letter {
  color: #d7d7d7;
}

.tier-A .tier-letter {
  color: #e08b45;
}

.tier-B .tier-letter {
  color: #7e9cc5;
}

.tier-C .tier-letter {
  color: #b28cbb;
}

.tier-X .tier-letter {
  color: #7b7b7b;
}

.tier-G .tier-letter {
  background: linear-gradient(
    90deg,
    #91e6a1,
    #9bd8ff,
    #8ee6b4,
    #91e6a1
  );
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: emeraldGradient 5s linear infinite;
}

@keyframes emeraldGradient {
  0% {
    background-position: 0% 50%;
  }

  100% {
    background-position: 250% 50%;
  }
}

.add-game {
  width: 100%;
  min-height: 58px;
  border: 1px dashed #333;
  border-radius: 8px;
  background: #111;
  color: #777;
  margin-top: 7px;
}

.add-game:hover {
  color: #aaa;
  border-color: #555;
  background: #151515;
}

.edit-mode .game-row {
  cursor: grab;
}

.edit-mode .game-row:active {
  cursor: grabbing;
}

.empty-tier {
  min-height: 58px;
  border-radius: 8px;
  border: 1px dashed #292929;
  background: #111;
}

.edit-panel {
  display: none;
}

body.edit-mode .edit-panel {
  display: block;
}

body.edit-mode .normal-only {
  display: none;
}

.edit-panel {
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(0,0,0,0.78);
  backdrop-filter: blur(8px);
  padding: 35px;
  overflow-y: auto;
}

.edit-panel-inner {
  max-width: 850px;
  margin: 0 auto;
  background: #111;
  border: 1px solid #292929;
  border-radius: 12px;
  padding: 25px;
}

.edit-panel h2 {
  margin: 0 0 20px;
  font-size: 23px;
}

.edit-field {
  margin-bottom: 16px;
}

.edit-field label {
  display: block;
  margin-bottom: 6px;
  color: #aaa;
  font-size: 13px;
}

.edit-field input,
.edit-field textarea {
  width: 100%;
  background: #0d0d0d;
  border: 1px solid #303030;
  color: #eee;
  border-radius: 7px;
  padding: 10px;
  outline: none;
}

.edit-field input:focus,
.edit-field textarea:focus {
  border-color: #555;
}

.edit-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,0.76);
  backdrop-filter: blur(7px);
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.modal.open {
  display: flex;
}

.modal-card {
  width: min(760px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #111;
  border: 1px solid #2b2b2b;
  border-radius: 14px;
  padding: 28px;
}

.modal-card h2 {
  margin: 0;
  font-family: Poppins, Inter, Arial, sans-serif;
  font-size: 27px;
  font-weight: 800;
}

.modal-card .overall {
  margin-top: 5px;
  color: #ddd;
  font-size: 22px;
  font-weight: 700;
}

.rating-list {
  margin-top: 22px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px 22px;
}

.rating-item {
  display: grid;
  grid-template-columns: 1fr 70px;
  gap: 10px;
  align-items: center;
}

.rating-item span {
  color: #cfcfcf;
  font-size: 14px;
}

.rating-item input {
  width: 70px;
  background: #0d0d0d;
  border: 1px solid #303030;
  border-radius: 6px;
  color: #fff;
  padding: 7px;
  text-align: center;
}

.commentary {
  margin-top: 22px;
}

.commentary textarea {
  width: 100%;
  min-height: 120px;
  resize: vertical;
  background: #0d0d0d;
  border: 1px solid #303030;
  border-radius: 8px;
  color: #eee;
  padding: 11px;
}

.modal-actions {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  gap: 10px;
}

.delete-button {
  background: #291313;
  border-color: #512323;
  color: #ef7777;
}

.delete-button:hover {
  background: #351717;
}

.login-card {
  width: min(400px, 100%);
  background: #111;
  border: 1px solid #2b2b2b;
  border-radius: 12px;
  padding: 25px;
}

.login-card h2 {
  margin-top: 0;
}

.login-card input {
  width: 100%;
  padding: 10px;
  background: #0d0d0d;
  color: #fff;
  border: 1px solid #303030;
  border-radius: 7px;
}

.error {
  color: #f55951;
  font-size: 13px;
  margin-top: 8px;
}

@media (max-width: 1500px) {
  .page {
    padding-left: 22px;
    padding-right: 22px;
  }

  .tiers {
    gap: 9px;
  }

  .tier-column {
    min-width: 220px;
  }
}

@media (max-width: 1100px) {
  .tiers {
    width: max-content;
  }

  .tier-column {
    flex: 0 0 250px;
  }
}

@media (max-width: 700px) {
  .page {
    padding: 25px 14px 50px;
  }

  .header h1 {
    font-size: 28px;
  }

  .header p {
    font-size: 16px;
  }

  .rating-list {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="header">
    <h1>GAMES PLAYED BY BIEST1X</h1>
    <p>a personal tier list</p>
  </header>

  <div class="top-actions">
    <div class="left-actions">
      <button
        id="editButton"
        class="action-button primary"
      >
        Edit

    <div class="right-actions">
      <button

  <main

  ></main>

</div>

<!-- =========================================================
     LOGIN MODAL
========================================================= -->

<div

>
  <div class="login-card">

    <h2>Admin Login</h2>

    <div class="edit-field">
      <label for="loginPassword">
        Password
      </label>

      <input
        id="loginPassword"
        type="password"

      >
    </div>

    <div

    ></div>

      <button

      >

      <button
        id="loginSubmit"

      >

      </button>

    </div>

  </div>
</div>

<!-- =========================================================
     GAME MODAL
========================================================= -->

<div
  id="gameModal"
  class="modal"
>
  <div class="modal-card">

    <h2 id="gameModalTitle"></h2>

    <div
      id="gameModalOverall"

      <button

        Delete Game
      </button>

        style="
          display:flex;
          gap:10px;
        "
      >

        <button
          id="gameCancel"
          class="action-button"
        >
          Cancel
        </button>

        <button
          id="gameSave"
          class="action-button primary"
        >
          Save
        </button>

      </div>

    </div>

  </div>
</div>

<script>
const TIER_ORDER = [
  "SS",
  "S",
  "A",
  "B",
  "C",
  "X",
  "G"
];

const RATING_FIELDS = [
  {
    key: "gameplay",
    label: "Gameplay"
  },
  {
    key: "graphics",
    label: "Graphics & Visuals"
  },
  {
    key: "story_pacing",
    label: "Story & Pacing"
  },
  {
    key: "writing",
    label: "Writing"
  },
  {
    key: "voice_acting",
    label: "Voice Acting"
  },
  {
    key: "music_audio",
    label: "Music & Audio Design"
  },
  {
    key: "technical_performance",
    label: "Technical Performance"
  },
  {
    key: "emotional_impact",
    label: "Personal & Emotional Impact"
  }
];

const DEFAULT_TIERS = [
  {
    tier_key: "SS",
    letter: "SS",
    label: "Masterpiece",
    sub: "the most impact"
  },
  {
    tier_key: "S",
    letter: "S",
    label: "Excellent",
    sub: "Great games"
  },
  {
    tier_key: "A",
    letter: "A",
    label: "Great",
    sub: "Solid games"
  },
  {
    tier_key: "B",
    letter: "B",
    label: "Good / Okay",
    sub: "Nothing special / meh"
  },
  {
    tier_key: "C",
    letter: "C",
    label: "Mixed / Meh",
    sub: "Mixed experiences"
  },
  {
    tier_key: "X",
    letter: "X",
    label: "Not for me",
    sub: "Dropped / Disliked"
  },
  {
    tier_key: "G",
    letter: "G",
    label: "Childhood legend",
    sub: "Games that stayed with me"
  }
];

let games = [];
let tiers = [...DEFAULT_TIERS];
let editing = false;
let selectedGame = null;
let dragGameId = null;

const $ = id => document.getElementById(id);

function getToken() {
  return localStorage.getItem(
    "played-admin-token"
  );
}

function authHeaders() {
  const token = getToken();

  return token
    ? {
        Authorization:
          "Bearer " + token,
        "Content-Type":
          "application/json"
      }
    : {
        "Content-Type":
          "application/json"
      };
}

async function api(
  path,
  options = {}
) {
  const response =
    await fetch(
      path,
      {
        ...options,
        headers: {
          ...authHeaders(),
          ...(options.headers || {})
        }
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data =
      text
        ? JSON.parse(text)
        : {};
  } catch {
    throw new Error(
      text ||
      "Server returned invalid response"
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      "Request failed"
    );
  }

  return data;
}

function formatRating(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "0";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "0";
  }

  return Number.isInteger(n)
    ? String(n)
    : String(n);
}

function calculateOverall(game) {
  if (
    game.custom_overall !== null &&
    game.custom_overall !== undefined &&
    game.custom_overall !== ""
  ) {
    const custom =
      Number(game.custom_overall);

    if (
      Number.isFinite(custom)
    ) {
      return custom;
    }
  }

  const values =
    RATING_FIELDS.map(
      field =>
        Number(
          game[field.key] || 0
        )
    );

  if (!values.length) {
    return 0;
  }

  return Math.round(
    (
      values.reduce(
        (sum, value) =>
          sum + value,
        0
      ) /
      values.length
    ) * 10
  ) / 10;
}

function isHighlighted(game) {
  return (
    Number(
      calculateOverall(game)
    ) > 9.5
  );
}

function tierByKey(key) {
  return (
    tiers.find(
      tier =>
        tier.tier_key === key
    ) ||
    DEFAULT_TIERS.find(
      tier =>
        tier.tier_key === key
    )
  );
}

function render() {

  const container =
    $("tiers");

  container.innerHTML = "";

  for (
    const tierKey of TIER_ORDER
  ) {

    const tier =
      tierByKey(tierKey);

    if (!tier) {
      continue;
    }

    const column =
      document.createElement(
        "section"
      );

    column.className =
      "tier-column tier-" +
      tierKey;

    column.dataset.tier =
      tierKey;

    const header =
      document.createElement(
        "div"
      );

    header.className =
      "tier-header";

    header.innerHTML = `
      <div class="tier-letter">
        ${escapeHtml(
          tier.letter || tierKey
        )}
      </div>

      <div class="tier-label">
        ${escapeHtml(
          tier.label || ""
        )}
      </div>

      <div class="tier-sub">
        ${escapeHtml(
          tier.sub || ""
        )}
      </div>
    `;

    const list =
      document.createElement(
        "div"
      );

    list.className =
      "tier-games";

    list.dataset.tier =
      tierKey;

    const tierGames =
      games
        .filter(
          game =>
            game.tier === tierKey
        )
        .sort(
          (a, b) =>
            Number(a.position || 0) -
            Number(b.position || 0)
        );

    for (
      const game of tierGames
    ) {

      list.appendChild(
        createGameRow(game)
      );
    }

    if (!tierGames.length) {
      const empty =
        document.createElement(
          "div"
        );

      empty.className =
        "empty-tier";

      list.appendChild(empty);
    }

    const add =
      document.createElement(
        "button"
      );

    add.className =
      "add-game";

    add.textContent =
      "+ Add game";

    add.addEventListener(
      "click",
      () => addGame(tierKey)
    );

    column.appendChild(header);
    column.appendChild(list);
    column.appendChild(add);

    setupDropTarget(list);

    container.appendChild(column);
  }

  document.body.classList.toggle(
    "edit-mode",
    editing
  );
}

function createGameRow(game) {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "game-row";

  if (
    isHighlighted(game)
  ) {
    row.classList.add(
      "highlighted"
    );
  }

  row.draggable =
    editing;

  row.dataset.id =
    game.id;

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "game-name";

  name.textContent =
    game.name || "Unnamed Game";

  const rating =
    document.createElement(
      "div"
    );

  rating.className =
    "game-rating";

  rating.textContent =
    formatRating(
      calculateOverall(game)
    );

  row.appendChild(name);
  row.appendChild(rating);

  row.addEventListener(
    "click",
    event => {

      if (
        event.target.closest(
          "button,input,textarea"
        )
      ) {
        return;
      }

      openGame(game.id);
    }
  );

  row.addEventListener(
    "dragstart",
    event => {

      if (!editing) {
        event.preventDefault();
        return;
      }

      dragGameId =
        game.id;

      row.classList.add(
        "dragging"
      );

      event.dataTransfer.effectAllowed =
        "move";

      event.dataTransfer.setData(
        "text/plain",
        game.id
      );
    }
  );

  row.addEventListener(
    "dragend",
    () => {

      row.classList.remove(
        "dragging"
      );

      dragGameId = null;
    }
  );

  return row;
}

function setupDropTarget(list) {

  list.addEventListener(
    "dragover",
    event => {

      if (!editing) {
        return;
      }

      event.preventDefault();

      const dragged =
        document.querySelector(
          ".game-row.dragging"
        );

      if (!dragged) {
        return;
      }

      const after =
        getDragAfterElement(
          list,
          event.clientY
        );

      if (!after) {
        list.appendChild(
          dragged
        );
      } else {
        list.insertBefore(
          dragged,
          after
        );
      }
    }
  );

  list.addEventListener(
    "drop",
    async event => {

      if (!editing) {
        return;
      }

      event.preventDefault();

      const id =
        dragGameId ||
        event.dataTransfer.getData(
          "text/plain"
        );

      if (!id) {
        return;
      }

      const rows =
        [...list.querySelectorAll(
          ".game-row"
        )];

      const index =
        rows.findIndex(
          row =>
            row.dataset.id === id
        );

      if (index < 0) {
        return;
      }

      const targetTier =
        list.dataset.tier;

      const game =
        games.find(
          item =>
            item.id === id
        );

      if (!game) {
        return;
      }

      const oldTier =
        game.tier;

      const oldPosition =
        game.position;

      // Optimistic local update.
      game.tier =
        targetTier;

      const tierRows =
        [...list.querySelectorAll(
          ".game-row"
        )];

      tierRows.forEach(
        (row, position) => {

          const item =
            games.find(
              g =>
                g.id ===
                row.dataset.id
            );

          if (item) {
            item.position =
              position;
          }
        }
      );

      render();

      try {

        await api(
          "/api/games/move",
          {
            method: "POST",
            body: JSON.stringify({
              id,
              tier: targetTier,
              position: index
            })
          }
        );

      } catch (error) {

        // Revert local state.
        game.tier =
          oldTier;

        game.position =
          oldPosition;

        await loadGames();

        alert(
          "Could not move game: " +
          error.message
        );
      }
    }
  );
}

function getDragAfterElement(
  container,
  y
) {

  const elements =
    [
      ...container.querySelectorAll(
        ".game-row:not(.dragging)"
      )
    ];

  let closest = {
    offset:
      Number.NEGATIVE_INFINITY,
    element:
      null
  };

  for (
    const element of elements
  ) {

    const box =
      element.getBoundingClientRect();

    const offset =
      y -
      box.top -
      box.height / 2;

    if (
      offset < 0 &&
      offset >
        closest.offset
    ) {

      closest = {
        offset,
        element
      };
    }
  }

  return closest.element;
}

async function loadGames() {

  const data =
    await api(
      "/api/games"
    );

  games =
    data.games || [];

  render();
}

async function loadTiers() {

  try {

    const data =
      await api(
        "/api/tiers"
      );

    if (
      Array.isArray(
        data.tiers
      ) &&
      data.tiers.length
    ) {

      tiers =
        data.tiers;
    }

  } catch {

    tiers =
      [...DEFAULT_TIERS];
  }

  render();
}

async function loadEverything() {

  try {

    // Parallel requests instead of waiting
    // for one database request to finish
    // before starting the other.
    await Promise.all([
      loadGames(),
      loadTiers()
    ]);

  } catch (error) {

    console.error(error);

    alert(
      "Could not load list: " +
      error.message
    );
  }
}

async function saveGame(game) {

  const payload = {
    id: game.id,
    name: game.name,
    tier: game.tier,
    commentary:
      game.commentary || ""
  };

  for (
    const field of RATING_FIELDS
  ) {

    payload[field.key] =
      Number(
        game[field.key] || 0
      );
  }

  payload.custom_overall =
    game.custom_overall === "" ||
    game.custom_overall ===
      undefined
      ? null
      : game.custom_overall;

  await api(
    "/api/games",
    {
      method: "PUT",
      body:
        JSON.stringify(payload)
    }
  );
}

async function openGame(id) {

  const game =
    games.find(
      item =>
        item.id === id
    );

  if (!game) {
    return;
  }

  selectedGame =
    game;

  $("gameModalTitle")
    .textContent =
    game.name || "";

  updateModalOverall();

  const list =
    $("ratingList");

  list.innerHTML = "";

  for (
    const field of RATING_FIELDS
  ) {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "rating-item";

    item.innerHTML = `
      <span>
        ${escapeHtml(
          field.label
        )}
      </span>

      <input
        type="number"
        step="0.1"
        data-rating="${field.key}"
        value="${escapeAttr(
          game[field.key] ?? 0
        )}"
      >
    `;

    const input =
      item.querySelector(
        "input"
      );

    input.addEventListener(
      "input",
      () => {

        game[field.key] =
          input.value === ""
            ? 0
            : Number(
                input.value
              );

        updateModalOverall();
      }
    );

    list.appendChild(item);
  }

  const custom =
    document.createElement(
      "div"
    );

  custom.className =
    "rating-item";

  custom.innerHTML = `
    <span>
      Custom Overall
    </span>

    <input
      type="number"
      step="0.1"
      data-rating="custom_overall"
      value="${
        game.custom_overall ===
        null ||
        game.custom_overall ===
        undefined
          ? ""
          : escapeAttr(
              game.custom_overall
            )
      }"
      placeholder="Auto"
    >
  `;

  const customInput =
    custom.querySelector(
      "input"
    );

  customInput.addEventListener(
    "input",
    () => {

      game.custom_overall =
        customInput.value === ""
          ? null
          : Number(
              customInput.value
            );

      updateModalOverall();
    }
  );

  list.appendChild(custom);

  $("commentaryInput")
    .value =
    game.commentary || "";

  $("gameModal")
    .classList.add(
      "open"
    );
}

function updateModalOverall() {

  if (!selectedGame) {
    return;
  }

  $("gameModalOverall")
    .textContent =
    "Overall: " +
    formatRating(
      calculateOverall(
        selectedGame
      )
    ) +
    " / 10";
}

$("gameSave")
  .addEventListener(
    "click",
    async () => {

      if (!selectedGame) {
        return;
      }

      const button =
        $("gameSave");

      button.disabled =
        true;

      try {

        selectedGame.commentary =
          $("commentaryInput")
            .value;

        await saveGame(
          selectedGame
        );

        $("gameModal")
          .classList.remove(
            "open"
          );

        render();

      } catch (error) {

        alert(
          "Could not save game: " +
          error.message
        );

      } finally {

        button.disabled =
          false;
      }
    }
  );

$("gameCancel")
  .addEventListener(
    "click",
    () => {

      $("gameModal")
        .classList.remove(
          "open"
        );

      selectedGame =
        null;
    }
  );

$("deleteGameButton")
  .addEventListener(
    "click",
    async () => {

      if (!selectedGame) {
        return;
      }

      if (
        !confirm(
          "Delete " +
          selectedGame.name +
          "?"
        )
      ) {
        return;
      }

      try {

        await api(
          "/api/games/" +
          encodeURIComponent(
            selectedGame.id
          ),
          {
            method: "DELETE"
          }
        );

        games =
          games.filter(
            game =>
              game.id !==
              selectedGame.id
          );

        $("gameModal")
          .classList.remove(
            "open"
          );

        selectedGame =
          null;

        render();

      } catch (error) {

        alert(
          "Could not delete game: " +
          error.message
        );
      }
    }
  );

async function addGame(
  tier = "A"
) {

  if (!editing) {
    return;
  }

  const name =
    prompt(
      "Game name:"
    );

  if (!name) {
    return;
  }

  try {

    const data =
      await api(
        "/api/games",
        {
          method: "POST",
          body:
            JSON.stringify({
              name,
              tier
            })
        }
      );

    games.push({
      id: data.id,
      name,
      tier,
      commentary: "",
      position:
        games.filter(
          game =>
            game.tier === tier
        ).length,
      gameplay: 0,
      graphics: 0,
      story_pacing: 0,
      writing: 0,
      voice_acting: 0,
      music_audio: 0,
      technical_performance: 0,
      emotional_impact: 0,
      custom_overall: null,
      overall: 0
    });

    render();

  } catch (error) {

    alert(
      "Could not add game: " +
      error.message
    );
  }
}

$("addGameButton")
  .addEventListener(
    "click",
    () => addGame("A")
  );

$("editButton")
  .addEventListener(
    "click",
    async () => {

      if (!getToken()) {

        $("loginPassword")
          .value = "";

        $("loginError")
          .textContent = "";

        $("loginModal")
          .classList.add(
            "open"
          );

        return;
      }

      editing =
        !editing;

      render();
    }
  );

$("loginCancel")
  .addEventListener(
    "click",
    () => {

      $("loginModal")
        .classList.remove(
          "open"
        );
    }
  );

$("loginSubmit")
  .addEventListener(
    "click",
    async () => {

      const password =
        $("loginPassword")
          .value;

      try {

        const data =
          await api(
            "/api/login",
            {
              method: "POST",
              body:
                JSON.stringify({
                  password
                })
            }
          );

        localStorage.setItem(
          "played-admin-token",
          data.token
        );

        $("loginModal")
          .classList.remove(
            "open"
          );

        editing =
          true;

        render();

      } catch {

        $("loginError")
          .textContent =
          "Invalid password";
      }
    }
  );

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      $("gameModal")
        .classList.remove(
          "open"
        );

      $("loginModal")
        .classList.remove(
          "open"
        );
    }
  }
);

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function escapeAttr(value) {
  return escapeHtml(value);
}

loadEverything();
</script>

</body>
</html>
